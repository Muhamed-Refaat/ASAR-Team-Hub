class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error)
      return (
        <div className="panel loading">
          <h2>The page could not render</h2>
          <p>{this.state.error.message}</p>
          <Button onClick={() => location.reload()}>Reload</Button>
        </div>
      );
    return this.props.children;
  }
}
function EventSaves({
  jobs,
  onRetry,
  onDismiss,
  onNavigate,
  onTelegramPreview,
}) {
  if (!jobs.length) return null;
  const pending = jobs.filter((job) =>
    ["queued", "saving"].includes(job.state),
  ).length;
  const failed = jobs.filter((job) => job.state === "failed").length;
  return (
    <section className="panel event-saves" aria-label="Event saves">
      <div className="row spread">
        <h2>Event saves</h2>
        <span role="status">
          {pending
            ? `${pending} saving in the background`
            : failed
              ? `${failed} need attention`
              : "All changes saved"}
        </span>
      </div>
      <div className="event-save-list">
        {jobs.map((job) => (
          <div className="event-save-item" key={job.id}>
            <div className="grow">
              <strong dir="auto">{job.title || job.payload.title}</strong>
              <span
                className={
                  "badge " +
                  (job.state === "saved"
                    ? "success"
                    : job.state === "failed"
                      ? "warning"
                      : "accent")
                }
              >
                {job.state === "saved"
                  ? "Saved"
                  : job.state === "superseded"
                    ? "Replaced by a newer update"
                    : job.state === "failed"
                      ? "Save unconfirmed"
                      : job.state === "queued"
                        ? "Waiting to save"
                        : "Saving…"}
              </span>
              {job.error && (
                <p className="save-error" dir="auto">
                  {job.error}
                </p>
              )}
            </div>
            <div className="row">
              {job.state === "saved" &&
                job.kind !== "update" &&
                onTelegramPreview && (
                  <Button
                    className="small"
                    icon="send"
                    onClick={() =>
                      onTelegramPreview(
                        job.event?.key ||
                          `${job.type}:${job.type.toLowerCase()}-${job.payload.newId}`,
                      )
                    }
                  >
                    Preview Telegram
                  </Button>
                )}
              {job.state === "failed" && (
                <Button
                  className="small primary"
                  onClick={() => onRetry(job.id)}
                >
                  {job.kind === "update" ? "Retry update" : "Retry save"}
                </Button>
              )}
              <Button className="small" onClick={() => onNavigate(job.type)}>
                View
              </Button>
              {["saved", "failed", "superseded"].includes(job.state) && (
                <Button
                  className="small icon-button"
                  icon="x"
                  aria-label={`Dismiss save notice for ${job.title || job.payload.title}`}
                  onClick={() => onDismiss(job.id)}
                />
              )}
            </div>
          </div>
        ))}
      </div>
    </section>
  );
}

              aria-label={`Switch to ${theme === "light" ? "dark" : "light"} theme`}
              title="Switch theme"
            />
            <div className="avatar">{initials(member ? member.Name : "?")}</div>
            <div>
              <div className="account-name" dir="auto">
                {member ? member.Name : "Unidentified account"}
              </div>
              <div className="account-email">
                {db.activeUserSession.email || "Sign in through Google"}
              </div>
              <div className="row account-tags">
                {member && <span className="badge">{M.role(member)}</span>}
                <AdminBadge db={db} member={member} />
              </div>
            </div>
          </div>
        </div>
        <nav className="tabs" aria-label="Main navigation">
          {tabs.map(([id, label, icon]) => (
            <button
              className={"tab " + (tab === id ? "active" : "")}
              aria-current={tab === id ? "page" : undefined}
              key={id}
              onClick={() => navigate(id)}
            >
              <Icon name={icon} size={16} />
              {label}
              {admin &&
                pendingReviews.some(
                  (row) => id === "logs" || row["Event Type"] === id,
                ) && (
                  <span
                    className="badge warning nav-review-count"
                    aria-hidden="true"
                    title="Pending submissions to review"
                  >
                    {
                      pendingReviews.filter(
                        (row) => id === "logs" || row["Event Type"] === id,
                      ).length
                    }
                  </span>
                )}
            </button>
          ))}
        </nav>
      </header>
      <main className="main" id="main">
        <EventSaves
          jobs={myJobs}
          onRetry={(id) => {
            if (updates.some((job) => job.id === id))
              actionsRef.current.retry(id);
            else syncRef.current.retry(id);
          }}
          onDismiss={(id) => {
            if (updates.some((job) => job.id === id))
              actionsRef.current.dismiss(id);
            else syncRef.current.dismiss(id);
          }}
          onNavigate={navigate}
          onTelegramPreview={openTelegram}
        />
        <div
          className="stack"
          style={{ marginBottom: !member || error ? 20 : 0 }}
        >
          {!member && (
            <Notice kind="warning">
              Your Google account is not identified in the Team sheet. Sign in
              with your team email to record completions. An unidentified
              account has view access only.
            </Notice>
          )}
          {error && !modal && <Notice kind="error">{error}</Notice>}
        </div>
        {tab === "overview" && (
          <Overview db={db} member={member} onNavigate={navigate} />
        )}
        {M.TYPES.includes(tab) && tab !== "Skill" && (
          <EventTab
            key={tab}
            type={tab}
            db={db}
            member={member}
            admin={admin}
            onEdit={edit}
            onCreate={create}
            onComplete={complete}
            onRevert={(e, submission) =>
              command("revertCompletion", {
                key: e.key,
                submissionId: submission?.["Submission ID"] || "",
              })
            }
            onReview={review}
            onReviewEvent={reviewEvent}
            onTaskLink={command}
            onTelegramPreview={openTelegram}
            onArchive={(e) =>
              command("archiveEvent", { key: e.key, archived: !e.archived })
            }
            onMove={(key, status) => command("moveTask", { key, status })}
            jobs={myJobs}
            busy={busy}
          />
        )}
        {tab === "Skill" && (
          <SkillsPage
            key={member?.Mail || "anonymous"}
            db={db}
            member={member}
            admin={admin}
            onComplete={complete}
            onRevert={(e, submission) =>
              command("revertCompletion", {
                key: e.key,
                submissionId: submission?.["Submission ID"] || "",
              })
            }
            onManage={(m) => {
              setError("");
              setModal({ kind: "requirements", member: m });
            }}
            busy={busy}
            updates={updates}
          />
        )}
        {tab === "intelligence" && (
          <Intelligence
            initialMemberId={profileId}
            db={db}
            member={member}
            theme={theme}
            onNavigate={navigate}
            onExport={doExport}
            onPrint={doPrint}
            onRemove={
              admin
                ? (person) => {
                    setError("");
                    setModal({ kind: "remove-member", member: person });
                  }
                : undefined
            }
          />
        )}
        {tab === "hierarchy" && (
          <Hierarchy
            db={db}
            member={member}
            admin={admin}
            onSave={command}
            busy={busy}
            error={error}
            onNavigate={navigate}
            onViewMember={(m) => {
              navigate("intelligence", M.memberKey(m));
            }}
          />
        )}
        {tab === "logs" && (
          <History
            key={tab}
            kind={tab}
            db={db}
            member={member}
            admin={admin}
            onReview={review}
            busy={busy}
          />
        )}
        {tab === "activity" && (
          <Activity
            db={db}
            member={member}
            admin={admin}
            refreshing={loading}
          />
        )}
        {unmatched.length > 0 && ["logs", "intelligence"].includes(tab) && (
          <div style={{ marginTop: 20 }}>
            <Notice kind="warning">
              {unmatched.length} legacy names do not match the Team sheet. Add
              their exact old names to the member’s Aliases cell to include them
              in progress.{" "}
              <details>
                <summary>View unmatched names</summary>
                {unmatched.map((n) => (
                  <p key={n}>{n}</p>
                ))}
              </details>
            </Notice>
          </div>
        )}
      </main>
      <footer className="page-footer">
        <div className="row spread">
          <span>ASAR Team Hub · Progress from recorded team data</span>
          <span>
            {db.team.length} members ·{" "}
            {M.events(db).filter((e) => !e.archived).length} active events
          </span>
        </div>
        {IS_LOCAL && (
          <details className="export-tools">
            <summary>Local database tools</summary>
            <p>
              Refresh reloads the current session. Reload CSVs discards session
              edits. Export changed tables before importing them into the
              workbook.
            </p>
            <div className="row" style={{ marginTop: 12 }}>
              <Button
                className="small"
                onClick={() => load(true)}
                disabled={busy || pendingSaves || loading}
              >
                Reload CSVs
              </Button>
              {Object.entries(LocalHub.sheets)
                .filter(
                  ([key]) => !["supervisor", "skills", "exam"].includes(key),
                )
                .map(([key, name]) => (
                  <Button
                    key={key}
                    className="small"
                    onClick={() =>
                      saveBlob(
                        new Blob([LocalHub.csv(key)], {
                          type: "text/csv;charset=utf-8",
                        }),
                        name + ".csv",
                      )
                    }
                  >
                    Export {name}.csv
                  </Button>
                ))}
            </div>
          </details>
        )}
      </footer>
      {modal?.kind === "telegram" && member && (
        <TelegramPreview
          key={modal.key}
          eventKey={modal.key}
          onLoad={loadTelegram}
          onQueue={command}
          onClose={() => {
            setModal(null);
            setError("");
          }}
          busy={busy}
          error={error}
        />
      )}
      {modal?.kind === "remove-member" && admin && (
        <Modal
          title="Remove team member"
          onClose={() => {
            setModal(null);
            setError("");
          }}
        >
          <div className="stack">
            <p>
              Remove <strong dir="auto">{modal.member.Name}</strong> from the
              active team? Their profile and past activity stay recorded, and
              their ability to update the hub will stop.
            </p>
            <p className="muted">
              Assign another leader first if they lead a subteam alone.
            </p>
            {error && <Notice kind="error">{error}</Notice>}
            <div className="row modal-actions">
              <Button onClick={() => setModal(null)}>Cancel</Button>
              <Button
                className="danger"
                icon="user-minus"
                onClick={() =>
                  command("removeMember", {
                    memberId: M.memberKey(modal.member),
                    title: modal.member.Name,
                  })
                }
              >
                Confirm removal
              </Button>
            </div>
          </div>
        </Modal>
      )}
      {modal?.kind === "edit" && (
        <EventEditor
          event={modal.event}
          type={modal.type}
          db={db}
          onSave={command}
          onClose={() => {
            setModal(null);
            setError("");
          }}
          busy={busy}
          error={error}
        />
      )}
      {modal?.kind === "complete" && member && (
        <CompletionEditor
          event={modal.event}
          member={member}
          onSave={command}
          onClose={() => {
            setModal(null);
            setError("");
          }}
          busy={busy}
          error={error}
        />
      )}
      {modal?.kind === "requirements" && admin && (
        <SkillRequirementsEditor
          db={db}
          member={modal.member}
          onSave={command}
          onClose={() => {
            setModal(null);
            setError("");
          }}
          busy={busy}
          error={error}
        />
      )}
      {modal?.kind === "review" && admin && (
        <ReviewEditor
          submission={modal.submission}
          onSave={command}
          onClose={() => {
            setModal(null);
            setError("");
          }}
          busy={busy}
          error={error}
        />
      )}
      {modal?.kind === "review-list" && admin && (
        <Modal
          title={
            modal.event.type === "Meet"
              ? "Review attendance"
              : "Review completions"
          }
          busy={busy}
          onClose={() => setModal(null)}
        >
          <ReviewQueue
            db={db}
            type={modal.event.type}
            eventId={modal.event.key}
            onReview={review}
            busy={busy}
          />
        </Modal>
      )}
      {toast && (
        <div className="toast" role="status">
          {toast}
        </div>
      )}
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>,
);

    </script>
  </body>
</html>
