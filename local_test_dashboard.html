    // CSV line-parser supporting nested quotes and escaped characters
    function parseCSV(csvText) {
      const lines = csvText.split('\n');
      if (lines.length < 1 || !lines[0]) return [];
      
      const parseLine = (line) => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(current);
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current);
        return result.map(x => x.replace(/^"|"$/g, '').replace(/\\n/g, '\n').trim());
      };

      const headers = parseLine(lines[0]);
      const data = [];
      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const rowVals = parseLine(line);
        const rowObj = {};
        for (let j = 0; j < headers.length; j++) {
          rowObj[headers[j]] = rowVals[j] || null;
        }
        data.push(rowObj);
      }
      return data;
    }

    // Console Logging
    function appendLog(message, type = 'info') {
      const c = document.getElementById('consoleLogs');
      if (!c) return;
      const color = type === 'write' ? 'text-amber-400' : type === 'error' ? 'text-rose-500' : type === 'read' ? 'text-teal-400' : 'text-slate-400';
      const indicator = type === 'write' ? '[WRITE]' : type === 'error' ? '[ERROR]' : type === 'read' ? '[READ]' : '[INFO]';
      const el = document.createElement('div');
      el.className = `${color}`;
      el.innerHTML = `<span class="opacity-55">${new Date().toLocaleTimeString()}</span> <span class="font-bold">${indicator}</span> ${message}`;
      c.appendChild(el);
      c.scrollTop = c.scrollHeight;
    }

    function clearConsole() {
      const c = document.getElementById('consoleLogs');
      if (c) c.innerHTML = '<div class="text-slate-500">[CONSOLE] Logs cleared.</div>';
    }

    // Global in-memory DB arrays
    let LOCAL_DB = {
      supervisor: [], team: [], skills: [], learning: [], meet: [], exam: [], tasks: [], logs: []
    };

    let isUsingExternalCSVs = false;

    // Async Fetch function with fallback for loading detached CSV sheets
    async function fetchCSVSheet(sheetName, fallbackData) {
      try {
        const response = await fetch(`./spreedsheet-copy/${sheetName}.csv`);
        if (response.ok) {
          const csvText = await response.text();
          const parsed = parseCSV(csvText);
          appendLog(`Loaded '${sheetName}.csv' from spreedsheet-copy/.`, "read");
          isUsingExternalCSVs = true;
          return parsed;
        }
      } catch (err) {
        // Fetch failed (likely CORS on file://)
      }
      return parseCSV(fallbackData);
    }

    // Database Initializer
    async function initDatabase() {
      LOCAL_DB.supervisor = await fetchCSVSheet('Supervisor', FALLBACK_SUPERVISOR_CSV);
      LOCAL_DB.team = await fetchCSVSheet('Team', FALLBACK_TEAM_CSV);
      LOCAL_DB.skills = await fetchCSVSheet('Skill', FALLBACK_SKILL_CSV);
      LOCAL_DB.learning = await fetchCSVSheet('Learning', FALLBACK_LEARNING_CSV);
      LOCAL_DB.meet = await fetchCSVSheet('Meet', FALLBACK_MEET_CSV);
      LOCAL_DB.exam = await fetchCSVSheet('Exam', FALLBACK_EXAM_CSV);
      LOCAL_DB.tasks = await fetchCSVSheet('Task', FALLBACK_TASK_CSV);
      LOCAL_DB.logs = await fetchCSVSheet('Log', FALLBACK_LOG_CSV);

      const indicator = document.getElementById('source-indicator');
      if (indicator) {
        if (isUsingExternalCSVs) {
          indicator.className = "text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-900 px-2 py-0.5 rounded font-bold";
          indicator.innerHTML = "Connected: External CSV Files";
          appendLog("Dynamic HTTP CSV parsing is active. Server confirmed.", "info");
        } else {
          indicator.className = "text-[10px] bg-amber-950 text-amber-400 border border-amber-900 px-2 py-0.5 rounded font-bold";
          indicator.innerHTML = "Local Preview (Embedded Fallback)";
          appendLog("CORS / File security restricts local fetch(). Using embedded mock fallback. Run a local server (e.g. python -m http.server 8000) to load external .csv files dynamically.", "error");
        }
      }
      window.dispatchEvent(new Event('localDBChanged'));
    }

    // Trigger Initial Load
    setTimeout(initDatabase, 100);

    function resetLocalDB() {
      isUsingExternalCSVs = false;
      initDatabase();
      appendLog("Local database re-synchronized to pristine defaults.", "info");
    }

    // Exports updated logs as a downloadable CSV file
    function exportCurrentLogs() {
      if (LOCAL_DB.logs.length === 0) return;
      
      const headers = ['Event Type', 'Event ID', 'Event Name', 'Invited/Assigned', 'Attendees/Completed', 'Due to Date'];
      let csvContent = headers.join(',') + '\n';
      
      LOCAL_DB.logs.forEach(row => {
        const line = headers.map(header => {
          let val = row[header] || '';
          // Escape quotes and wrap with quotes if newlines/commas exist
          if (val.includes(',') || val.includes('\n') || val.includes('"')) {
            val = `"${val.replace(/"/g, '""')}"`;
          }
          return val;
        });
        csvContent += line.join(',') + '\n';
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.setAttribute('download', 'Log.csv');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      appendLog("Exported Log.csv to downloads directory.", "info");
    }

    // Mock script run API
    window.google = {
      script: {
        run: {
          successHandler: null,
          failureHandler: null,

          logEvent(type, name, invitedList, dueDate) {
            setTimeout(() => {
              appendLog(`google.script.run.logEvent('${type}', '${name}', [${invitedList.length} members], '${dueDate}') triggered.`, "write");
              
              const maxId = LOCAL_DB.logs.reduce((max, log) => {
                const id = parseFloat(log["Event ID"]);
                return !isNaN(id) && id > max ? id : max;
              }, 0);
              const newId = maxId + 1;
              
              const newRow = {
                "Event Type": type,
                "Event ID": String(newId),
                "Event Name": name,
                "Invited/Assigned": invitedList.join('\n'),
                "Attendees/Completed": "",
                "Due to Date": dueDate
              };
              
              LOCAL_DB.logs.unshift(newRow);
              appendLog(`Successfully appended event row with Event ID: ${newId} to in-memory Log dataset. Click 'Export Log.csv' to download.`, "write");
              
              if (this.successHandler) {
                this.successHandler({ success: true, newId: newId });
              }
              window.dispatchEvent(new Event('localDBChanged'));
            }, 400);
          },
          attendEvent(eventId, userName) {
            setTimeout(() => {
              appendLog(`google.script.run.attendEvent(${eventId}, '${userName}') triggered.`, "write");
              
              const logIndex = LOCAL_DB.logs.findIndex(log => parseFloat(log["Event ID"]) === parseFloat(eventId));
              if (logIndex === -1) {
                appendLog(`Row search failed! Event ID ${eventId} not found.`, "error");
                if (this.failureHandler) this.failureHandler(new Error("Event ID not found"));
                return;
              }
              
              let attendees = LOCAL_DB.logs[logIndex]["Attendees/Completed"] ? LOCAL_DB.logs[logIndex]["Attendees/Completed"].split('\n').map(x => x.trim()) : [];
              if (!attendees.includes(userName.trim())) {
                attendees.push(userName.trim());
                LOCAL_DB.logs[logIndex]["Attendees/Completed"] = attendees.join('\n');
                appendLog(`Successfully added '${userName}' to Attendees/Completed column. Click 'Export Log.csv' to download.`, "write");
              } else {
                appendLog(`User '${userName}' is already registered as an attendee for this event. No update needed.`, "info");
              }
              
              if (this.successHandler) this.successHandler({ success: true });
              window.dispatchEvent(new Event('localDBChanged'));
            }, 300);
          },
          reopenEvent(eventId, newDueDate) {
            setTimeout(() => {
              appendLog(`google.script.run.reopenEvent(${eventId}, '${newDueDate}') triggered.`, "write");
              
              const logIndex = LOCAL_DB.logs.findIndex(log => parseFloat(log["Event ID"]) === parseFloat(eventId));
              if (logIndex === -1) {
                appendLog(`Event ID ${eventId} not found in Log dataset.`, "error");
                if (this.failureHandler) this.failureHandler(new Error("Event ID not found"));
                return;
              }
              
              LOCAL_DB.logs[logIndex]["Due to Date"] = newDueDate;
              appendLog(`Successfully re-opened registration window. Modified column 'Due to Date' of Event ID ${eventId} to '${newDueDate}'. Click 'Export Log.csv' to download.`, "write");
              
              if (this.successHandler) this.successHandler({ success: true });
              window.dispatchEvent(new Event('localDBChanged'));
            }, 300);
          }
        }
      }
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, info: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        console.error("React Error Boundary Caught:", error, info);
        this.setState({ error, info });
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: '40px', background: '#fee2e2', color: '#991b1b', fontFamily: 'sans-serif' }}>
              <h1 style={{ fontSize: '24px', fontWeight: 'bold' }}>Dashboard Render Error</h1>
              <p style={{ marginTop: '10px', fontSize: '14px' }}>{this.state.error && this.state.error.toString()}</p>
              <pre style={{ marginTop: '20px', background: 'white', padding: '20px', borderRadius: '8px', overflow: 'auto', fontSize: '12px' }}>
                {this.state.info && this.state.info.componentStack}
              </pre>
            </div>
          );
        }
        return this.props.children;
      }
    }


    // React Lucide Icon component
    const Icon = ({ name, className = "w-5 h-5", strokeWidth = 2 }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = '';
          const iconEl = window.lucide.createIcons({
            attrs: {
              class: className,
              'stroke-width': strokeWidth
            },
            name: name
          });
          if (iconEl && iconEl[name]) {
            ref.current.appendChild(iconEl[name].cloneNode(true));
          }
        }
      }, [name, className, strokeWidth]);

      return <span ref={ref} className="inline-flex items-center justify-center" />;
    };

    // Card component
    const Card = ({ children, className = "" }) => (
      <div class={`bg-white border border-slate-100 rounded-2xl shadow-saas p-6 transition-all duration-300 hover:shadow-saas-lg ${className}`}>
        {children}
      </div>
    );

    // Modal component
    const Modal = ({ isOpen, onClose, title, children }) => {

// Normalizes name comparing: replace hyphen with spaces, lowercase, trim.


/**
 * 1. Backend Data Fetching
 * Fetches the raw flat learning tracks array from the Google Apps Script Web App.
 * @param {string} apiUrl - The Google Apps Script deployment URL.
 * @returns {Promise<Array>} Flat course list.
 */
const fetchLearningData = async (apiUrl) => {
  try {
    const response = await fetch(`${apiUrl}?action=learning`);
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    const data = await response.json();
    return data;
  } catch (error) {
    console.error("Failed to fetch learning track database:", error);
    throw error;
  }
}

/**
 * 2. Grouping & Metrics Calculation
 * Transforms flat course entries into grouped tracks, calculating track-level
 * and user completion statistics dynamically.
 * 
 * @param {Array} courses - Flat course array from the database.
 * @param {Array} logs - Completed event logs database.
 * @param {Object} currentUser - Active logged-in team member.
 * @returns {Array} Grouped track array.
 */
const groupCoursesByTrack = (courses, logs, currentUser) => {
  const nameNorm = currentUser ? normalizeName(currentUser.Name) : '';
  const tracksMap = {};

  courses.forEach(course => {
    // Standardize IDs and strings
    const trackIdRaw = course["Track ID"];
    const trackId = trackIdRaw !== undefined && trackIdRaw !== null && trackIdRaw !== '' ? parseFloat(trackIdRaw) : null;
    if (trackId === null || isNaN(trackId)) return; // Skip rows without valid Track ID

    const trackName = (course["Track Name"] || 'Unassigned Track').trim().replace(/\n/g, '');
    const trackOverview = course["Track Overview"] || 'Track details are currently being scheduled.';
    const courseName = course["Course Name"] || course["Topic name"] || '';

    // Initialize track group if not existing
    if (!tracksMap[trackId]) {
      tracksMap[trackId] = {
        trackId,
        trackName,
        trackOverview,
        courses: []
      };
    }

    // Capture the overview if available in current row
    if (trackOverview && (!tracksMap[trackId].trackOverview || tracksMap[trackId].trackOverview.startsWith('Track details are currently'))) {
      tracksMap[trackId].trackOverview = trackOverview;
    }

    // Only add course object if courseName is present
    if (courseName && courseName.trim()) {
      // Calculate completion dynamically by matching event log name and attendees
      const isCompleted = logs.some(log => 
        (log["Event Type"] === 'Learning' || log["Event Type"] === 'Skill') && 
        normalizeName(log["Event Name"]) === normalizeName(courseName) &&
        log["Attendees/Completed"] && 
        log["Attendees/Completed"].split('\n').some(c => normalizeName(c) === nameNorm)
      );

      const isMandatory = (course["Mandatory/Optional"] || course["Obligability"] || '').trim().toLowerCase() === 'mandatory';
      const estimatedHours = parseFloat(course["Estimated Hours"]) || 0;
      const courseUrl = course["Course URL"] || course["Link"] || '';
      const platform = course["Platform"] || '';

      tracksMap[trackId].courses.push({
        courseName: courseName.trim(),
        isMandatory,
        estimatedHours,
        courseUrl,
        platform,
        isCompleted
      });
    }
  });

  // Convert to sorted array
  const tracks = Object.values(tracksMap).sort((a, b) => a.trackId - b.trackId);

  // Calculate statistics for each group
  tracks.forEach(track => {
    const totalCourses = track.courses.length;
    const completedCourses = track.courses.filter(c => c.isCompleted).length;
    const completionPercentage = totalCourses > 0 ? Math.round((completedCourses / totalCourses) * 100) : 0;

    const mandatoryCourses = track.courses.filter(c => c.isMandatory);
    const totalMandatory = mandatoryCourses.length;
    const completedMandatory = mandatoryCourses.filter(c => c.isCompleted).length;

    track.metrics = {
      totalCourses,
      completedCourses,
      completionPercentage,
      totalMandatory,
      completedMandatory
    };
  });

  return tracks;
}

            const completedList = matchingSkillLog["Attendees/Completed"] ? matchingSkillLog["Attendees/Completed"].split('\n') : [];
            const invitedList = matchingSkillLog["Invited/Assigned"] ? matchingSkillLog["Invited/Assigned"].split('\n') : [];
            
            if (completedList.some(c => normalizeName(c) === nameNorm)) {
              score = 95;
            } else if (invitedList.some(i => normalizeName(i) === nameNorm)) {
              const overdue = new Date(matchingSkillLog["Due to Date"]) < new Date();
              score = overdue ? 45 : 65;
            }
          }

          if (subject === 'Leadership' && (currentUser.Rule && currentUser.Rule.toLowerCase().includes('lead') || currentUser.Rule && currentUser.Rule.toLowerCase().includes('supervisor'))) {
            score = 95;
          }
          if (subject === 'Communication' && completedTasks > 0) score += Math.min(30, completedTasks * 10);
          if (subject === 'Problem Solving' && completedTasks > 0) score += Math.min(40, completedTasks * 15);

          return { subject, score: Math.min(100, score) };
        });

        const userMeets = teamData.logs.filter(log => log["Event Type"] === 'Meet');
        const attendedMeets = userMeets.filter(log => {
          const attendees = log["Attendees/Completed"] ? log["Attendees/Completed"].split('\n') : [];
          return attendees.some(att => normalizeName(att) === nameNorm);
        }).length;
        const invitedMeets = userMeets.filter(log => {
          const invited = log["Invited/Assigned"] ? log["Invited/Assigned"].split('\n') : [];
          return invited.some(inv => normalizeName(inv) === nameNorm);
        }).length;

        return {
          assignedTasksCount, completedTasks, pendingTasks, learningProgress,
          completedLearningCount, invitedLearningCount, skillScores, attendedMeets, invitedMeets
        };
      }, [currentUser, teamData]);

      const teamContributionData = useMemo(() => {
        if (!teamData.team || !teamData.tasks) return { categories: [], assigned: [], completed: [] };

        const categories = [];
        const assigned = [];
        const completed = [];

        teamData.team.slice(0, 10).forEach(member => {
          const nameNorm = normalizeName(member.Name);
          categories.push(member.Name.split('-')[0]);
          
          const memberTasks = teamData.tasks.filter(t => {
            if (!t.Assignees) return false;
            return t.Assignees.split(',').some(assignee => normalizeName(assignee) === nameNorm);
          });
          assigned.push(memberTasks.length);
          completed.push(memberTasks.filter(t => t.Status && t.Status.toLowerCase() === 'completed').length);
        });

        return { categories, assigned, completed };
      }, [teamData]);

      const userEventsAndStatus = useMemo(() => {
        if (!currentUser) return [];

        const nameNorm = normalizeName(currentUser.Name);
        const today = new Date();
        today.setHours(0,0,0,0);

        return teamData.logs.map(log => {
          const invitedList = log["Invited/Assigned"] ? log["Invited/Assigned"].split('\n').map(x => x.trim()) : [];
          const completedList = log["Attendees/Completed"] ? log["Attendees/Completed"].split('\n').map(x => x.trim()) : [];
          
          const isInvited = invitedList.some(i => normalizeName(i) === nameNorm);
          const isCompleted = completedList.some(c => normalizeName(c) === nameNorm);

          let parsedDueDate = null;
          if (log["Due to Date"]) {
            parsedDueDate = new Date(log["Due to Date"]);
            parsedDueDate.setHours(0,0,0,0);
          }

          let status = 'Inactive';
          if (isInvited) {
            if (isCompleted) {
              status = 'Completed';
            } else if (parsedDueDate && parsedDueDate < today) {
              status = 'Overdue';
            } else {
              status = 'Active';
            }
          }

          return {
            ...log,
            isInvited, isCompleted, status,
            formattedDueDate: log["Due to Date"] || 'No deadline'
          };
        }).filter(e => e.isInvited);
      }, [currentUser, teamData]);

      const overdueCount = useMemo(() => userEventsAndStatus.filter(e => e.status === 'Overdue').length, [userEventsAndStatus]);
      const activeCount = useMemo(() => userEventsAndStatus.filter(e => e.status === 'Active').length, [userEventsAndStatus]);

      const isLeader = useMemo(() => {
        if (!currentUser) return false;
        const role = currentUser.Rule || '';
        return role.toLowerCase().includes('lead') || role.toLowerCase().includes('supervisor') || normalizeName(currentUser.Name) === 'abdallah allam' || normalizeName(currentUser.Name) === 'abdallah-allam';
      }, [currentUser]);

      const getMemberMetrics = (member) => {
        const nameNorm = normalizeName(member.Name);
        const mTasks = teamData.tasks.filter(t => {
          if (!t.Assignees) return false;
          return t.Assignees.split(',').some(assignee => normalizeName(assignee) === nameNorm);
        });
        const completedCount = mTasks.filter(t => t.Status && t.Status.toLowerCase() === 'completed').length;
        
        const mLearningEvents = teamData.logs.filter(log => {
          if (log["Event Type"] !== 'Learning' && log["Event Type"] !== 'Skill') return false;
          const invited = log["Invited/Assigned"] ? log["Invited/Assigned"].split('\n') : [];
          return invited.some(inv => normalizeName(inv) === nameNorm);
        });
        const completedLearning = mLearningEvents.filter(log => {
          const completed = log["Attendees/Completed"] ? log["Attendees/Completed"].split('\n') : [];
          return completed.some(comp => normalizeName(comp) === nameNorm);
        }).length;
        
        // Dynamic DB-aligned learning progress
        const totalCoursesInDb = teamData.learning.filter(track => track["Course Name"] || track["Topic name"]).length;
        const completedCoursesInDb = teamData.learning.filter(track => {
          const cName = track["Course Name"] || track["Topic name"];
          if (!cName) return false;
          return teamData.logs.some(log => 
            (log["Event Type"] === 'Learning' || log["Event Type"] === 'Skill') && 
            normalizeName(log["Event Name"]) === normalizeName(cName) &&
            log["Attendees/Completed"] && 
            log["Attendees/Completed"].split('\n').some(c => normalizeName(c) === nameNorm)
          );
        }).length;
        const learningProgress = totalCoursesInDb > 0 ? Math.round((completedCoursesInDb / totalCoursesInDb) * 100) : 0;

        const baseSkills = [...new Set([
          ...(teamData.skills || []).map(s => s["Skill Name"] || s["SkillName"] || s["skill name"]).filter(Boolean),
          'Leadership',
          'Communication',
          'Problem Solving'
        ])];
        const skills = baseSkills.map(subject => {
          let score = 40;
          const matchingSkillLog = teamData.logs.find(log => 
            log["Event Type"] === 'Skill' && normalizeName(log["Event Name"]) === normalizeName(subject)
          );

          if (matchingSkillLog) {
            const completedList = matchingSkillLog["Attendees/Completed"] ? matchingSkillLog["Attendees/Completed"].split('\n') : [];
            if (completedList.some(c => normalizeName(c) === nameNorm)) score = 95;
          }

          if (subject === 'Leadership' && (member.Rule && member.Rule.toLowerCase().includes('lead') || member.Rule && member.Rule.toLowerCase().includes('supervisor'))) {
            score = 95;
          }
          if (subject === 'Communication' && completedCount > 0) score += Math.min(30, completedCount * 10);
          return { subject, score: Math.min(100, score) };
        });

        return { tasksCompleted: completedCount, tasksAssigned: mTasks.length, learningProgress, skills };
      };

      if (loading) {
        return (

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                    <div class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
                      {userEventsAndStatus.length > 0 ? (

              </div>
            )}

            {/* -------------------- Tab 2: LEARNING TRACKS PANEL -------------------- */}
            {activeTab === 'learning' && (
              <div class="space-y-6">
                <div class="flex items-center justify-between">
                  <div>
                    <h3 class="text-lg font-bold text-slate-900">Learning Tracks Intelligence</h3>
                    <p class="text-xs text-slate-400 font-medium">Browse, launch, and validate course modules synced with the team learning track database.</p>
                  </div>
                </div>

                <div 
                  id="learning-tracks-container" 
                  ref={(el) => {
                    if (el) {
                      renderLearningTracks(el, teamData.learning, teamData.logs, currentUser);
                    }
                  }}
                ></div>
              </div>
            )}

            {activeTab === 'team' && (
              <div class="space-y-6">
                <div>
                  <h3 class="text-lg font-bold text-slate-900">Team Intelligence Matrix</h3>
                  <p class="text-xs text-slate-400 font-medium">Click on any team member's card to view their dynamic skill mapping, completed logs, and key indices.</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                  {teamData.team.map((member, idx) => {
                    const metrics = getMemberMetrics(member);
                    return (
                      <div 
                        key={idx}
                        onClick={() => setSelectedMember({ ...member, ...metrics })}
                        class="bg-white border border-slate-100 rounded-3xl p-5 shadow-saas hover:shadow-saas-lg hover:border-brand-100/50 cursor-pointer transition-all duration-300 transform hover:scale-[1.01] flex flex-col items-center text-center space-y-4 group"
                      >
                        <div class="relative">
                          <div class="w-16 h-16 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center font-black text-2xl border border-brand-100/30 uppercase">
                            {member.Name.charAt(0)}
                          </div>
                          <span class="absolute bottom-[-4px] right-[-4px] bg-emerald-500 w-3.5 h-3.5 rounded-full border-2 border-white"></span>
                        </div>

                        <div>
                          <h4 class="text-xs font-black text-slate-800 tracking-tight leading-tight">{member.Name}</h4>
                          <p class="text-[10px] text-slate-400 font-semibold mt-0.5">{member.Rule || 'Software Engineer'}</p>
                        </div>

                        <div class="grid grid-cols-2 gap-x-4 w-full bg-slate-50/50 p-2.5 rounded-xl border border-slate-50 text-left">
                          <div>
                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Tasks</span>
                            <span class="text-xs font-black text-slate-700 block mt-0.5">{metrics.tasksCompleted}/{metrics.tasksAssigned}</span>
                          </div>
                          <div class="border-l border-slate-200/60 pl-3">
                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Learning</span>
                            <span class="text-xs font-black text-slate-700 block mt-0.5">{metrics.learningProgress}%</span>
                          </div>
                        </div>

                        <span class="text-[10px] font-bold text-brand-500 flex items-center gap-0.5">
                          View details <Icon name="chevron-right" className="w-3.5 h-3.5" />
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

          </main>

          <Modal isOpen={showLogModal} onClose={() => setShowLogModal(false)} title="Log New Event">
            <form onSubmit={handleLogSubmit} class="space-y-4">
              <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Event Type</label>
                <select
                  value={newLogEntry.type}
                  onChange={(e) => setNewLogEntry({ ...newLogEntry, type: e.target.value })}
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all text-slate-700"
                >
                  <option value="Skill">Skill Workshop</option>
                  <option value="Meet">Meeting Alignment</option>
                  <option value="Learning">Training / Learning Track</option>
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Event Name</label>
                <input
                  type="text" required placeholder="e.g. PySpark Big Data Workshop"
                  value={newLogEntry.name}
                  onChange={(e) => setNewLogEntry({ ...newLogEntry, name: e.target.value })}
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
                />
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Due Date (Open Window)</label>
                <input
                  type="date" required
                  value={newLogEntry.dueDate}
                  onChange={(e) => setNewLogEntry({ ...newLogEntry, dueDate: e.target.value })}
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 text-slate-700"
                />
              </div>

              <div class="pt-4 flex gap-3">
                <button type="button" onClick={() => setShowLogModal(false)} class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-500">Cancel</button>
                <button type="submit" class="flex-1 px-4 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold shadow-sm shadow-brand-100">Log Event to Sheet</button>
              </div>
            </form>
          </Modal>

          <Modal isOpen={showReopenModal !== null} onClose={() => setShowReopenModal(null)} title="Re-open Registration Window">
            {showReopenModal && (
              <form onSubmit={handleReopenSubmit} class="space-y-4">
                <div class="p-3 bg-brand-50/50 border border-brand-100/30 rounded-xl">
                  <p class="text-[11px] text-brand-800 font-bold leading-none">Selected Event</p>
                  <p class="text-xs text-brand-900 font-semibold mt-1">"{showReopenModal["Event Name"]}" ({showReopenModal["Event Type"]})</p>
                </div>

                <div>
                  <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">New Due Date (Open Window)</label>
                  <input
                    type="date" required
                    value={reopenDueDate}
                    onChange={(e) => setReopenDueDate(e.target.value)}
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 text-slate-700"
                  />
                </div>

                <div class="pt-4 flex gap-3">
                  <button type="button" onClick={() => setShowReopenModal(null)} class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-500">Cancel</button>
                  <button type="submit" class="flex-1 px-4 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold">Update Window Date</button>
                </div>
              </form>
            )}
          </Modal>

          <Modal isOpen={selectedMember !== null} onClose={() => setSelectedMember(null)} title="Member Intelligence Hub">
            {selectedMember && (
              <div class="space-y-6">
                <div class="flex items-center gap-4 border-b border-slate-100 pb-4">
                  <div class="w-14 h-14 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center font-black text-xl border border-brand-100/30 uppercase">
                    {selectedMember.Name.charAt(0)}
                  </div>
                  <div>
                    <h4 class="text-sm font-black text-slate-900 leading-none">{selectedMember.Name}</h4>
                    <p class="text-[11px] text-slate-400 font-semibold mt-1">{selectedMember.Rule || 'Software Engineer'}</p>
                    <p class="text-[10px] text-slate-300 font-bold mt-1 flex items-center gap-1">
                      <Icon name="credit-card" className="w-3.5 h-3.5" /> ID: {selectedMember.ID || 'N/A'}
                    </p>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                  <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100 text-left">
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Tasks Completed</span>
                    <span class="text-lg font-black text-slate-700 block mt-0.5">{selectedMember.tasksCompleted}/{selectedMember.tasksAssigned}</span>
                  </div>
                  <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100 text-left">
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Learning Track Index</span>
                    <span class="text-lg font-black text-slate-700 block mt-0.5">{selectedMember.learningProgress}%</span>
                  </div>
                </div>

                <div class="space-y-2">
                  <h5 class="text-[11px] font-black text-slate-400 uppercase tracking-wider">Dynamic Skill Mapping</h5>
                  <div class="border border-slate-50 rounded-3xl p-3 flex justify-center bg-slate-50/20">
                    <SkillRadar 
                      data={selectedMember.skills.map(s => s.score)}
                      categories={selectedMember.skills.map(s => s.subject)}
                      memberName={selectedMember.Name}
                    />
                  </div>
                </div>

                <div class="space-y-3.5">
                  <h5 class="text-[11px] font-black text-slate-400 uppercase tracking-wider">Skill Index Breakdown</h5>
                  <div class="space-y-2.5">
                    {selectedMember.skills.slice(0, 3).map((sk, index) => (
                      <div key={index} class="space-y-1">
                        <div class="flex items-center justify-between text-[11px] font-bold text-slate-700">
                          <span>{sk.subject}</span>
                          <span>{sk.score}/100</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                          <div class="bg-brand-500 h-1.5 rounded-full" style={{ width: `${sk.score}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div class="pt-2 flex justify-end">
                  <button onClick={() => setSelectedMember(null)} class="px-4 py-2 bg-slate-50 border border-slate-150 hover:bg-slate-100 rounded-xl text-xs font-bold text-slate-600 transition-colors">Close Hub</button>
                </div>
              </div>
            )}
          </Modal>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>

  <!-- Lucide Script Initialization -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
