    // RFC-4180 CSV parser: quoted newlines belong to the same spreadsheet row.
    function parseCSV(csvText) {
      const records = [];
      let row = [], cell = '', quoted = false;
      for (let i = 0; i < String(csvText || '').length; i++) {
        const char = csvText[i];
        const next = csvText[i + 1];
        if (char === '"' && quoted && next === '"') { cell += '"'; i++; continue; }
        if (char === '"') { quoted = !quoted; continue; }
        if (char === ',' && !quoted) { row.push(cell); cell = ''; continue; }
        if ((char === '\n' || char === '\r') && !quoted) {
          if (char === '\r' && next === '\n') i++;
          row.push(cell); cell = '';
          if (row.some(value => String(value).trim() !== '')) records.push(row);
          row = [];
          continue;
        }
        cell += char;
      }
      if (cell !== '' || row.length) { row.push(cell); records.push(row); }
      if (!records.length) return [];
      const headers = records[0].map(value => String(value).trim());
      return records.slice(1).map(values => headers.reduce((object, header, index) => {
        object[header] = values[index] !== undefined && String(values[index]).trim() !== '' ? String(values[index]).trim() : null;
        return object;
      }, {}));
    }

 * This file contains the vanilla JS logic to fetch, group, calculate,
 * and dynamically render the course tracks UI using Tailwind CSS.
 */

// Normalizes name comparing: replace hyphen with spaces, lowercase, trim.


/**
 * 1. Backend Data Fetching
 * Fetches the raw flat learning tracks array from the Google Apps Script Web App.
 * @param {string} apiUrl - The Google Apps Script deployment URL.
 * @returns {Promise<Array>} Flat course list.
 */
const fetchLearningData = async (apiUrl) => {
  try {
    const response = await fetch(`${apiUrl}?action=learning`);
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    const data = await response.json();
    return data;
  } catch (error) {
    console.error("Failed to fetch learning track database:", error);
    throw error;
  }
}

/**
 * 2. Grouping & Metrics Calculation
 * Transforms flat course entries into grouped tracks, calculating track-level
 * and user completion statistics dynamically.
 * 
 * @param {Array} courses - Flat course array from the database.
 * @param {Array} logs - Completed event logs database.
 * @param {Object} currentUser - Active logged-in team member.
 * @returns {Array} Grouped track array.
 */
const groupCoursesByTrack = (courses, logs, currentUser) => {
  const nameNorm = currentUser ? normalizeName(currentUser.Name) : '';
  const tracksMap = {};

  courses.forEach(course => {
    // Standardize IDs and strings
    const trackIdRaw = course["Track ID"];
    const trackId = trackIdRaw !== undefined && trackIdRaw !== null && trackIdRaw !== '' ? parseFloat(trackIdRaw) : null;
    if (trackId === null || isNaN(trackId)) return; // Skip rows without valid Track ID

    const trackName = (course["Track Name"] || 'Unassigned Track').trim().replace(/\n/g, '');
    const trackOverview = course["Track Overview"] || 'Track details are currently being scheduled.';
    const courseName = course["Course Name"] || course["Topic name"] || '';

    // Initialize track group if not existing
    if (!tracksMap[trackId]) {
      tracksMap[trackId] = {
        trackId,
        trackName,
        trackOverview,
        courses: []
      };
    }

    // Capture the overview if available in current row
    if (trackOverview && (!tracksMap[trackId].trackOverview || tracksMap[trackId].trackOverview.startsWith('Track details are currently'))) {
      tracksMap[trackId].trackOverview = trackOverview;
    }

    // Only add course object if courseName is present
    if (courseName && courseName.trim()) {
      // Calculate completion dynamically by matching event log name and attendees
      const isCompleted = logs.some(log => 
        (log["Event Type"] === 'Learning' || log["Event Type"] === 'Skill') && 
        normalizeName(log["Event Name"]) === normalizeName(courseName) &&
        log["Attendees/Completed"] && 
        log["Attendees/Completed"].split('\n').some(c => normalizeName(c) === nameNorm)
      );

      const isMandatory = (course["Mandatory/Optional"] || course["Obligability"] || '').trim().toLowerCase() === 'mandatory';
      const estimatedHours = parseFloat(course["Estimated Hours"]) || 0;
      const courseUrl = course["Course URL"] || course["Link"] || '';
      const platform = course["Platform"] || '';

      tracksMap[trackId].courses.push({
        courseName: courseName.trim(),
        isMandatory,
        estimatedHours,
        courseUrl,
        platform,
        isCompleted
      });
    }
  });

  // Convert to sorted array
  const tracks = Object.values(tracksMap).sort((a, b) => a.trackId - b.trackId);

  // Calculate statistics for each group
  tracks.forEach(track => {
    const totalCourses = track.courses.length;
    const completedCourses = track.courses.filter(c => c.isCompleted).length;
    const completionPercentage = totalCourses > 0 ? Math.round((completedCourses / totalCourses) * 100) : 0;

    const mandatoryCourses = track.courses.filter(c => c.isMandatory);
    const totalMandatory = mandatoryCourses.length;
    const completedMandatory = mandatoryCourses.filter(c => c.isCompleted).length;

    track.metrics = {
      totalCourses,
      completedCourses,
      completionPercentage,
      totalMandatory,
      completedMandatory
    };
  });

  return tracks;
}

        const events = [];
        if (!teamData) return events;

        // 1. Skills (type: Skill)
        if (teamData.skills) {
          teamData.skills.forEach(s => {

            events.push({
              name: s["Skill Name"] || "",
              type: "Skill",
              dueDate: logEntry ? logEntry["Due to Date"] : "2026-12-31",
              reopenWindow: reopenWindow

        // 2. Meet (type: Meet)
        if (teamData.meet) {
          teamData.meet.forEach(m => {

            const reopenWindow = logEntry ? (new Date(logEntry["Due to Date"]) >= new Date()) : false;
            events.push({
              name: m["Meeting title"] || "",
              type: "Meet",
              dueDate: m["Date"] || (logEntry ? logEntry["Due to Date"] : "2026-12-31"),
              reopenWindow: reopenWindow

        // 3. Learning (type: Learning)
        if (teamData.learning) {
          teamData.learning.forEach(l => {
            const logEntry = teamData.logs ? teamData.logs.find(l => l["Event Type"] === "Learning" && l["Event Name"] === l["Topic name"]) : null;
            const reopenWindow = logEntry ? (new Date(logEntry["Due to Date"]) >= new Date()) : false;
            events.push({
              name: l["Topic name"] || "",
              type: "Learning",
              dueDate: logEntry ? logEntry["Due to Date"] : "2026-12-31",
              reopenWindow: reopenWindow
            });
          });

        // Include custom events created in the Log sheet so they can be selected
        // later from the Log Event form, even when they are not in a source sheet.
        if (teamData.logs) {
          teamData.logs.forEach(log => {
            const name = String(log["Event Name"] || '').trim();
            const type = String(log["Event Type"] || '').trim();
            if (!name || !type) return;
            events.push({
              name,
              type,
              dueDate: log["Due to Date"] || todayForInput(),
              evidence: log.Evidence || log.evidence || '',
              source: 'log',
              reopenWindow: false
            });
          });
        }

        return events.filter((event, index, all) => all.slice(index + 1).every(candidate =>
          normalizeName(candidate.name) !== normalizeName(event.name) || candidate.type !== event.type
        ));

      }, [teamData]);

      // Filter available events based on event type, due date (Crucial Rule) and search query
      const filteredAvailableEvents = useMemo(() => {
        const typeFiltered = availableEvents.filter(ev => ev.type === newLogEntry.type);
        const today = new Date();
        today.setHours(0,0,0,0);

        const activeEvents = typeFiltered.filter(ev => {
          if (!ev.dueDate) return true;
          const due = new Date(ev.dueDate);
          due.setHours(0,0,0,0);
          return due >= today || ev.reopenWindow === true || ev.source === 'log';
        });

        if (!eventSearchQuery.trim()) return activeEvents;

        return activeEvents.filter(ev =>
          ev.name.toLowerCase().includes(eventSearchQuery.toLowerCase())
        );
      }, [availableEvents, newLogEntry.type, eventSearchQuery]);

      const userEventsAndStatus = useMemo(() => {
        if (!currentUser) return [];

        const nameNorm = normalizeName(currentUser.Name);
        const today = new Date();
        today.setHours(0,0,0,0);

        return teamData.logs.map(log => {
          const invitedList = log["Invited/Assigned"] ? log["Invited/Assigned"].split('\n').map(x => x.trim()) : [];
          const completedList = log["Attendees/Completed"] ? log["Attendees/Completed"].split('\n').map(x => x.trim()) : [];
          
          const isInvited = invitedList.some(i => normalizeName(i) === nameNorm);
          const isCompleted = completedList.some(c => normalizeName(c) === nameNorm);

          let parsedDueDate = null;
          if (log["Due to Date"]) {
            parsedDueDate = new Date(log["Due to Date"]);
            parsedDueDate.setHours(0,0,0,0);
          }

          let status = 'Inactive';
          if (isInvited) {
            if (isCompleted) {
              status = 'Completed';
            } else if (parsedDueDate && parsedDueDate < today) {
              status = 'Overdue';
            } else {
              status = 'Active';
            }
          }

          return {
            ...log,

            formattedDueDate: log["Due to Date"] || 'No deadline'

      }, [currentUser, teamData]);

      const overdueCount = useMemo(() => userEventsAndStatus.filter(e => e.status === 'Overdue').length, [userEventsAndStatus]);
      const activeCount = useMemo(() => userEventsAndStatus.filter(e => e.status === 'Active').length, [userEventsAndStatus]);

      // Log rows are appended by Apps Script, while the local preview prepends them.
      // Use the highest Event ID so the webcast always reflects the newest event.
      const latestEvent = useMemo(() => {
        if (!teamData.logs || !teamData.logs.length) return null;
        return teamData.logs.reduce((latest, log) => {
          if (!latest) return log;
          const latestId = parseFloat(latest["Event ID"]);
          const currentId = parseFloat(log["Event ID"]);
          if (Number.isFinite(currentId) && (!Number.isFinite(latestId) || currentId > latestId)) return log;
          return latest;
        }, null);
      }, [teamData.logs]);

      useEffect(() => {
        if (teamData.logs && teamData.logs.length) setShowNotification(true);
      }, [teamData.logs]);

      const isLeader = useMemo(() => {
        if (!currentUser) return false;
        const role = currentUser.Rule || '';
        return role.toLowerCase().includes('lead') || role.toLowerCase().includes('supervisor') || normalizeName(currentUser.Name) === 'abdallah allam' || normalizeName(currentUser.Name) === 'abdallah-allam';
      }, [currentUser]);

      // Generate hexagonal skill ratings (1-10 scale) dynamically parsed from sheet columns
      // with seeded fallbacks to ensure consistency and continuous rating support
      const getHexaSkills = (member, metrics) => {
        const nameHash = (member.Name || '').split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);

        // Base values seeded by the name hash to ensure uniqueness but consistency
        const seed1 = (nameHash % 5) + 4; // 4 to 8
        const seed2 = ((nameHash >> 1) % 5) + 5; // 5 to 9
        const seed3 = ((nameHash >> 2) % 4) + 6; // 6 to 9
        const seed4 = ((nameHash >> 3) % 5) + 4;
        const seed5 = ((nameHash >> 4) % 5) + 5;
        const seed6 = ((nameHash >> 5) % 4) + 6;

        const tasksFactor = metrics.tasksAssigned > 0 ? Math.min(2, Math.floor(metrics.tasksCompleted / 2)) : 0;
        const learningFactor = Math.floor(metrics.learningProgress / 40);
        const examFactor = Math.floor((metrics.examProgress || 0) / 50);
        const commitmentFactor = Math.floor((metrics.commitment || 0) / 50);

        // Parse serialized ratings from columns
        const parseSerializedRatings = (serializedStr) => {
          const ratings = {};
          if (!serializedStr) return ratings;
          const matches = serializedStr.match(/\{([^}]+)\}/g);
          if (matches) {
            matches.forEach(m => {
              const content = m.slice(1, -1);
              const parts = content.split(',');
              if (parts.length >= 2) {
                const valStr = parts.pop().trim();
                const key = parts.join(',').trim();
                const rating = parseInt(valStr, 10);
                if (!isNaN(rating)) {
                  ratings[key] = rating;
                }
              }
            });
          }
          return ratings;
        };

        const parsedHard = parseSerializedRatings(member["Hard Skill"] || member["HardSkill"]);
        const parsedSoft = parseSerializedRatings(member["Soft Skill"] || member["SoftSkill"]);
        const parsedTech = parseSerializedRatings(member["Technology"]);

        const getMatchedRating = (parsedRatings, targetCategory, fallbackValue) => {
          const clean = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          const targetClean = clean(targetCategory);
          
          for (const key in parsedRatings) {
            if (clean(key) === targetClean) {
              return parsedRatings[key];
            }
          }
          for (const key in parsedRatings) {
            const keyClean = clean(key);
            if (keyClean.startsWith(targetClean) || targetClean.startsWith(keyClean)) {
              return parsedRatings[key];
            }
          }
          return fallbackValue;
        };

        // 1. Hard Skills Matrix (11 categories)
        const hardCategories = [
          "Embedded Systems & Firmware (C/C++)",
          "High-Level Scripting & Middleware (Python)",
          "Version Control & Collaboration (Git/GitHub)",
          "Embedded Linux & SBC Administration",
          "Circuit Design & EDA Routing",
          "Power Electronics & Circuit Protection",
          "Mechanical Engineering & CAD",
          "Kinematics & Motion Control",
          "Sensor Fusion & State Estimation",
          "Computer Vision & Spatial AI",
          "SLM Fine tuning & Edge AI deployment"
        ];

        const hardSkills = hardCategories.map((cat, idx) => {
          const defaultSeed = [seed1, seed2, seed3, seed4, seed5, seed6, seed1, seed2, seed3, seed4, seed5][idx];
          const factor = (idx === 0) ? tasksFactor : (idx === 1) ? learningFactor : (idx === 8) ? examFactor : 0;
          const val = getMatchedRating(parsedHard, cat, defaultSeed);
          return Math.min(10, val + factor);
        });

        // 2. Soft Skills Matrix (5 categories)
        const softCategories = [
          "Systematic Root-Cause Isolation",
          "Critical Thinking & Architecture Trade-Off Analysis",
          "Safety-First Engineering Mindset (Fail-Safe Design)",
          "Adaptive Problem Solving & Agile Iteration",
          "Cross-Domain Systems Integration"
        ];

        const softSkills = softCategories.map((cat, idx) => {
          const defaultSeed = [seed3, seed1, seed2, seed5, seed6][idx];
          const factor = (idx === 0 || idx === 3) ? tasksFactor : (idx === 2) ? learningFactor : (idx === 4) ? commitmentFactor : 0;
          let val = getMatchedRating(parsedSoft, cat, defaultSeed);
          if (idx === 1 && member.Rule && member.Rule.toLowerCase().includes('lead')) {
            val = 9;
          }
          return Math.min(10, val + factor);
        });

        // 3. Technologies & Tools Matrix (9 categories)
        const techCategories = [
          "Autodesk Fusion 360 / SolidWorks",
          "KiCad EDA (v7.0+) / Proetus",
          "PlatformIO / VS Code / Arduino IDE 2.x",
          "Raspberry Pi OS (64-bit) / Ubuntu Server",
          "ROS 2 (Humble Hawksbill)",
          "slam_toolbox & ROS 2 Nav2",
          "OpenCV & ONNX Runtime / TFLite",
          "FastAPI (Python) / Express & WebSockets",
          "Gazebo / RViz2 / WebSockets Injection"
        ];

        const techSkills = techCategories.map((cat, idx) => {
          const defaultSeed = [seed1, seed2, seed3, seed4, seed5, seed6, seed2, seed3, seed4][idx];
          const factor = (idx === 4) ? tasksFactor : (idx === 6) ? learningFactor : (idx === 7) ? examFactor : 0;
          const val = getMatchedRating(parsedTech, cat, defaultSeed);
          return Math.min(10, val + factor);
        });

        // 4. Learning Matrix (6 categories)
        const learningSkills = [
          Math.min(10, Math.max(1, Math.round((metrics.learningProgress || 0) / 10))), // Course Completion
          Math.min(10, Math.max(1, (seed3 + tasksFactor))), // Tech Workshops
          Math.min(10, Math.max(1, (seed4 + learningFactor))), // Conceptual Ret.
          Math.min(10, Math.max(1, (seed5 + tasksFactor))), // Practical Apps
          Math.min(10, Math.max(1, (seed1 + learningFactor))), // Self-Study Pace
          Math.min(10, Math.max(1, Math.round((metrics.commitment || 0) / 10))) // Alignment Meetings / commitment
        ];

        return {
          hard: hardSkills,
          soft: softSkills,
          tech: techSkills,
          learning: learningSkills
        };
      };

      // Generate dynamic professional technical profiles matching a specific visual reference
      const getMemberProfileData = (member) => {
        const role = (member.Rule || '').toLowerCase();
        const name = member.Name || '';
        
        // If profile columns exist, parse them
        if (member.Knowledge && member.Skills && member.Abilities && member.Personality && member.Technology) {
          try {

        // Role-seeded profiles

        } else if (role.includes('mechanical') || role.includes('design') || role.includes('chassis')) {

          };
        } else if (role.includes('software') || role.includes('frontend') || role.includes('backend') || role.includes('web')) {
          return {

            ],

            ],

            ],

        } else {

            ],

              { category: "Interdisciplinary Sync", items: ["Translating software needs into mechanical constraints and vice-versa."] }
            ],

            ],
            technology: [
              { category: "Productivity Tools", items: ["Git, Python, Excel/Google Sheets, Terminal Scripting"] }
            ]
          };
        }
      };

      // Helper to parse or generate education records dynamically (reads Col L: Education)
      const getMemberEducation = (member) => {
        const rawEd = member.Education || member["Education"] || "";
        
        const parseSerializedEducation = (serializedStr) => {
          const items = [];
          if (!serializedStr) return items;
          const matches = serializedStr.match(/\{([^}]+)\}/g);
          if (matches) {
            matches.forEach(m => {
              const content = m.slice(1, -1);
              const parts = content.split(',');
              if (parts.length >= 2) {
                const detail = parts.pop().trim();
                const degree = parts.join(',').trim();
                items.push({ degree, detail });
              } else {
                items.push({ degree: content.trim(), detail: '' });
              }
            });
          } else {
            const lines = serializedStr.split('\n').map(s => s.trim()).filter(Boolean);
            lines.forEach(line => {
              const parts = line.split(',');
              if (parts.length >= 2) {
                const detail = parts.pop().trim();
                const degree = parts.join(',').trim();
                items.push({ degree, detail });
              } else {
                items.push({ degree: line, detail: '' });
              }
            });
          }
          return items;
        };

        const parsedList = parseSerializedEducation(rawEd);
        if (parsedList.length > 0) {
          return parsedList;
        }

        const role = (member.Rule || '').toLowerCase();
        const name = member.Name || '';
        
        if (role.includes('lead') || role.includes('supervisor') || name.toLowerCase().includes('allam')) {
          return [
            { degree: "B.Sc. in Mechatronics Engineering", detail: "Cairo University (First-Class Honors)" },
            { degree: "M.Sc. in Autonomous Robotics", detail: "In Progress (Focus: EKF State Fusion & Deep RL)" }
          ];
        } else if (role.includes('ai') || role.includes('data') || role.includes('intelligence')) {
          return [
            { degree: "B.Sc. in Computer Science & AI", detail: "Cairo University" },
            { degree: "DeepLearning.AI Certified Specialist", detail: "Generative AI & LLM Systems" }
          ];
        } else if (role.includes('mechanical') || role.includes('design') || role.includes('chassis')) {
          return [
            { degree: "B.Sc. in Mechanical Engineering", detail: "Cairo University" },
            { degree: "Autodesk Certified Professional", detail: "Mechanical Design & Simulation" }
          ];
        } else if (role.includes('software') || role.includes('frontend') || role.includes('backend') || role.includes('web')) {
          return [
            { degree: "B.Sc. in Computer Engineering", detail: "Cairo University" },
            { degree: "Full-Stack Developer Certification", detail: "React & Cloud Infrastructure" }
          ];
        } else {
          return [
            { degree: "B.Sc. in Mechatronics & Systems Engineering", detail: "Cairo University" }
          ];
        }
      };

      // Form-backed profile fields live on the Team sheet. Keep the lookup
      // tolerant of capitalization and future form-question wording changes.
      const getMemberOverview = (member) => {
        if (!member) return '';
        const values = Object.entries(member)
          .filter(([key]) => /overview|objective|summary|about|bio/i.test(String(key)))
          .map(([, value]) => {
            if (value && typeof value === 'object') return Object.values(value).join(' ');
            return String(value || '').replace(/[\r\n]+/g, ' ').trim();
          })
          .filter(Boolean);
        return [...new Set(values)].join(' ');
      };

      const getMemberSkillGroups = (member) => [
        { name: 'Hard skills', items: parseRatingColumn(member?.['Hard Skill'] || member?.HardSkill) },
        { name: 'Soft skills', items: parseRatingColumn(member?.['Soft Skill'] || member?.SoftSkill) },
        { name: 'Technology & tools', items: parseRatingColumn(member?.Technology) }
      ].filter(group => group.items.length > 0);

      const getMemberMetrics = (member) => {
        const nameNorm = normalizeName(member.Name);
        const mTasks = teamData.tasks.filter(t => {
          if (!t.Assignees) return false;
          return t.Assignees.split(',').some(assignee => normalizeName(assignee) === nameNorm);
        });
        const completedCount = mTasks.filter(t => t.Status && t.Status.toLowerCase() === 'completed').length;
        
        const mLearningEvents = teamData.logs.filter(log => {
          if (log["Event Type"] !== 'Learning' && log["Event Type"] !== 'Skill') return false;
          const invited = log["Invited/Assigned"] ? log["Invited/Assigned"].split('\n') : [];
          return invited.some(inv => normalizeName(inv) === nameNorm);
        });
        const completedLearning = mLearningEvents.filter(log => {
          const completed = log["Attendees/Completed"] ? log["Attendees/Completed"].split('\n') : [];
          return completed.some(comp => normalizeName(comp) === nameNorm);
        }).length;
        
        // Dynamic DB-aligned learning progress
        const totalCoursesInDb = teamData.learning.filter(track => track["Course Name"] || track["Topic name"]).length;
        const completedCoursesInDb = teamData.learning.filter(track => {
          const cName = track["Course Name"] || track["Topic name"];
          if (!cName) return false;
          return teamData.logs.some(log => 
            (log["Event Type"] === 'Learning' || log["Event Type"] === 'Skill') && 
            normalizeName(log["Event Name"]) === normalizeName(cName) &&
            log["Attendees/Completed"] && 
            log["Attendees/Completed"].split('\n').some(c => normalizeName(c) === nameNorm)
          );
        }).length;
        const learningProgress = totalCoursesInDb > 0 ? Math.round((completedCoursesInDb / totalCoursesInDb) * 100) : 0;

        const baseSkills = [...new Set([
          ...(teamData.skills || []).map(s => s["Skill Name"] || s["SkillName"] || s["skill name"]).filter(Boolean),
          'Leadership',
          'Communication',
          'Problem Solving'
        ])];
        const skills = baseSkills.map(subject => {
          let score = 40;
          const matchingSkillLog = teamData.logs.find(log => 
            log["Event Type"] === 'Skill' && normalizeName(log["Event Name"]) === normalizeName(subject)
          );

          if (matchingSkillLog) {
            const completedList = matchingSkillLog["Attendees/Completed"] ? matchingSkillLog["Attendees/Completed"].split('\n') : [];
            if (completedList.some(c => normalizeName(c) === nameNorm)) score = 95;
          }

          if (subject === 'Leadership' && (member.Rule && member.Rule.toLowerCase().includes('lead') || member.Rule && member.Rule.toLowerCase().includes('supervisor'))) {
            score = 95;
          }
          if (subject === 'Communication' && completedCount > 0) score += Math.min(30, completedCount * 10);
          return { subject, score: Math.min(100, score) };
        });

        const invitedEvents = teamData.logs.filter(log => ['Meet', 'Skill', 'Learning', 'Exam'].includes(log["Event Type"]) && splitPeople(log["Invited/Assigned"]).some(person => normalizeName(person) === nameNorm));
        const attendedEvents = invitedEvents.filter(log => splitPeople(log["Attendees/Completed"]).some(person => normalizeName(person) === nameNorm));
        const commitment = invitedEvents.length ? Math.round((attendedEvents.length / invitedEvents.length) * 100) : 0;
        const memberExams = teamData.logs.filter(log => log["Event Type"] === 'Exam' && splitPeople(log["Invited/Assigned"]).some(person => normalizeName(person) === nameNorm));
        const completedExams = memberExams.filter(log => splitPeople(log["Attendees/Completed"]).some(person => normalizeName(person) === nameNorm));

            </form>
          </Modal>

          <Modal isOpen={showTaskModal} onClose={() => { setShowTaskModal(false); setEditingTaskTitle(null); }} title={editingTaskTitle ? 'Edit task' : 'Create a task'}><form onSubmit={handleCreateTask} class="space-y-4"><input required value={taskDraft.title} onChange={e => setTaskDraft({ ...taskDraft, title: e.target.value })} placeholder="Task title" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-xs font-semibold" /><textarea value={taskDraft.description} onChange={e => setTaskDraft({ ...taskDraft, description: e.target.value })} placeholder="What needs to be delivered?" rows="3" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-xs font-semibold"></textarea><div><label class="mb-2 block text-[10px] font-black uppercase tracking-wider text-slate-400">Start in</label><select value={taskDraft.status} onChange={e => setTaskDraft({ ...taskDraft, status: e.target.value })} class="mb-3 w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-xs font-semibold"><option>Backlog</option><option>Pending</option><option>InProgress</option><option>Completed</option><option>Blocked</option></select></div><div class="max-h-32 space-y-2 overflow-y-auto rounded-xl border border-slate-200 bg-slate-50 p-3">{teamData.team.map(member => <label key={member.Name} class="flex items-center gap-2 text-xs font-semibold text-slate-600"><input type="checkbox" checked={taskDraft.assignees.includes(member.Name)} onChange={e => setTaskDraft({ ...taskDraft, assignees: e.target.checked ? [...taskDraft.assignees, member.Name] : taskDraft.assignees.filter(name => name !== member.Name) })} />{member.Name}</label>)}</div><button type="submit" class="w-full rounded-xl bg-brand-600 px-4 py-2.5 text-xs font-bold text-white">{editingTaskTitle ? 'Save task changes' : 'Create task'}</button></form></Modal>

          {/* ==================== MODAL 4: SET EVENT ADMIN ==================== */}
          <Modal 
            isOpen={showSetModal} 
            onClose={() => setShowSetModal(false)} 
            title="Set New Event"
          >
            <form onSubmit={handleSetSubmit} class="space-y-4">
              <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Event Type</label>
                <select
                  value={setEventEntry.type}
                  onChange={(e) => setSetEventEntry({ ...setEventEntry, type: e.target.value })}
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all text-slate-700"
                >
                  <option value="Skill">Skill Workshop</option>
                  <option value="Meet">Meeting Alignment</option>
                  <option value="Learning">Training / Learning Track</option>
                  <option value="Exam">Exam / Practical Test</option>
                  <option value="Task">Task Assignment</option>
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Event Name</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. PySpark Big Data Workshop"
                  value={setEventEntry.name}
                  onChange={(e) => setSetEventEntry({ ...setEventEntry, name: e.target.value })}
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all text-slate-700"
                />
              </div>

              {/* Assign / Invite Members Checklist */}
              <div class="space-y-2">
                <div class="flex items-center justify-between mb-1.5">
                  <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider">Assign / Invite Members</label>
                  <label class="flex items-center gap-1.5 text-xs font-semibold text-brand-600 cursor-pointer select-none">
                    <input
                      type="checkbox"
                      checked={setEventEntry.assignedMembers.length === (teamData.team ? teamData.team.length : 0)}
                      onChange={(e) => {
                        const allNames = teamData.team ? teamData.team.map(t => t.Name) : [];
                        setSetEventEntry(prev => ({
                          ...prev,
                          assignedMembers: e.target.checked ? allNames : []
                        }));
                      }}
                      class="rounded border-slate-300 text-brand-600 focus:ring-brand-500 w-3.5 h-3.5"
                    />
                    <span>Select All</span>
                  </label>
                </div>
                
                <div class="border border-slate-150 rounded-xl p-3.5 max-h-36 overflow-y-auto space-y-2 bg-slate-50/50 select-none touch-none">
                  {teamData.team && teamData.team.length > 0 ? (
                    teamData.team.map((m, idx) => {
                      const isChecked = setEventEntry.assignedMembers.includes(m.Name);
                      return (
                        <label 
                          key={idx} 
                          onMouseDown={(e) => {
                            e.preventDefault();
                            handleMemberMouseDown(m.Name, isChecked);
                          }}
                          onMouseEnter={() => handleMemberMouseEnter(m.Name)}
                          class="flex items-center gap-2.5 text-xs font-medium text-slate-700 cursor-pointer select-none py-0.5 hover:text-slate-900 text-left block"
                        >
                          <input
                            type="checkbox"
                            checked={isChecked}
                            readOnly
                            class="rounded border-slate-300 text-brand-600 focus:ring-brand-500 w-4 h-4 pointer-events-none"
                          />
                          <span>{m.Name}</span>
                        </label>
                      );
                    })
                  ) : (
                    <p class="text-xs text-slate-400 italic">No team members loaded</p>
                  )}
                </div>
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Due to Date</label>
                <input
                  type="date"
                  required
                  value={setEventEntry.dueDate}
                  onChange={(e) => setSetEventEntry({ ...setEventEntry, dueDate: e.target.value })}
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all text-slate-700"
                />
              </div>

              <div class="pt-4 flex gap-3">
                <button
                  type="button"
                  onClick={() => setShowSetModal(false)}
                  class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition-colors text-xs font-bold text-slate-500"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  class="flex-1 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 transition-all text-white text-xs font-bold shadow-sm shadow-indigo-100"
                >
                  Set Event
                </button>
              </div>
            </form>
          </Modal>

          <Modal isOpen={showReopenModal !== null} onClose={() => setShowReopenModal(null)} title="Re-open Registration Window">
            {showReopenModal && (
              <form onSubmit={handleReopenSubmit} class="space-y-4">
                <div class="p-3 bg-brand-50/50 border border-brand-100/30 rounded-xl">
                  <p class="text-[11px] text-brand-800 font-bold leading-none">Selected Event</p>
                  <p class="text-xs text-brand-900 font-semibold mt-1">"{showReopenModal["Event Name"]}" ({showReopenModal["Event Type"]})</p>
                </div>

                <div>
                  <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">New Due Date (Open Window)</label>
                  <input
                    type="date" required
                    value={reopenDueDate}
                    onChange={(e) => setReopenDueDate(e.target.value)}
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 text-slate-700"
                  />
                </div>

                <div class="pt-4 flex gap-3">
                  <button type="button" onClick={() => setShowReopenModal(null)} class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-500">Cancel</button>
                  <button type="submit" class="flex-1 px-4 py-2.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold">Update Window Date</button>
                </div>
              </form>
            )}
          </Modal>

          <Modal isOpen={selectedMember !== null} onClose={() => setSelectedMember(null)} title="Member Intelligence Hub">
            {selectedMember && (
              <div class="space-y-6">
                <div class="flex items-center gap-4 border-b border-slate-100 pb-4">
                  <div class="w-14 h-14 rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center font-black text-xl border border-brand-100/30 uppercase">
                    {selectedMember.Name.charAt(0)}
                  </div>
                  <div>
                    <h4 class="text-sm font-black text-slate-900 leading-none">{selectedMember.Name}</h4>
                    <p class="text-[11px] text-slate-400 font-semibold mt-1">{selectedMember.Rule || 'Software Engineer'}</p>
                    <p class="text-[10px] text-slate-300 font-bold mt-1 flex items-center gap-1">
                      <Icon name="credit-card" className="w-3.5 h-3.5" /> ID: {selectedMember.ID || 'N/A'}
                    </p>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                  <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100 text-left">
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Tasks Completed</span>
                    <span class="text-lg font-black text-slate-700 block mt-0.5">{selectedMember.tasksCompleted}/{selectedMember.tasksAssigned}</span>
                  </div>
                  <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100 text-left">
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Learning Track Index</span>
                    <span class="text-lg font-black text-slate-700 block mt-0.5">{selectedMember.learningProgress}%</span>
                  </div>
                </div>

                <div class="space-y-2">
                  <h5 class="text-[11px] font-black text-slate-400 uppercase tracking-wider">Dynamic Skill Mapping</h5>
                  <div class="border border-slate-50 rounded-3xl p-3 flex justify-center bg-slate-50/20">
                    <SkillRadar 
                      data={selectedMember.skills.map(s => s.score)}
                      categories={selectedMember.skills.map(s => s.subject)}
                      memberName={selectedMember.Name}
                    />
                  </div>
                </div>

                <div class="space-y-3.5">
                  <h5 class="text-[11px] font-black text-slate-400 uppercase tracking-wider">Skill Index Breakdown</h5>
                  <div class="space-y-2.5">
                    {selectedMember.skills.slice(0, 3).map((sk, index) => (
                      <div key={index} class="space-y-1">
                        <div class="flex items-center justify-between text-[11px] font-bold text-slate-700">
                          <span>{sk.subject}</span>
                          <span>{sk.score}/100</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                          <div class="bg-brand-500 h-1.5 rounded-full" style={{ width: `${sk.score}%` }}></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div class="pt-2 flex justify-end">
                  <button onClick={() => setSelectedMember(null)} class="px-4 py-2 bg-slate-50 border border-slate-150 hover:bg-slate-100 rounded-xl text-xs font-bold text-slate-600 transition-colors">Close Hub</button>
                </div>
              </div>
            )}
          </Modal>

          {/* GORGEOUS FLOATING TOAST NOTIFICATION */}
          {toast && (
            <div class="fixed bottom-24 right-6 bg-slate-900 border border-slate-800 text-white rounded-2xl px-4 py-3.5 shadow-saas-lg flex items-center gap-3 z-50 animate-in slide-in-from-bottom-5 duration-300">
              <div class="bg-brand-500 text-white p-1 rounded-full flex items-center justify-center">
                <Icon name="check" className="w-4 h-4" />
              </div>
              <div class="text-xs font-semibold text-left">{toast}</div>
              <button onClick={() => setToast(null)} class="text-slate-400 hover:text-white transition-colors pl-2 flex items-center justify-center">
                <Icon name="x" className="w-3.5 h-3.5" />
              </button>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>

  <!-- Lucide Script Initialization -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
