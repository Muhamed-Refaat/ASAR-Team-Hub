  background: var(--subtle);
  white-space: nowrap;
}
th,
td {

}
tbody tr:last-child td {

}
tbody tr.selected td {

}
td .button {

}
.sticky-col {

}
th.sticky-col {
  background: var(--subtle);

}
.matrix th:not(:first-child) {

}
.matrix td:not(:first-child) {

}
.rating {

  align-items: center;
  justify-content: center;
  min-width: 40px;

  font-weight: 800;
  background: var(--subtle);
  color: var(--muted);
}
.rating.high {
  background: var(--success-bg);
  color: var(--success);
}
.rating.mid {
  background: var(--accent-soft);
  color: var(--accent);
}
.task-board {
  display: grid;
  grid-template-columns: repeat(5, minmax(240px, 1fr));
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 12px;
}
.task-column {
  background: var(--subtle);
  border-radius: 12px;
  padding: 14px;
  min-width: 0;
}
.task-column h3 {

  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.task-column .event-card {

  margin-bottom: 12px;
}
.empty {

  color: var(--muted);

}
.empty h3 {

}
.notice {

  border: 1px solid var(--border);
  border-radius: 11px;

}
.notice.warning {

  color: var(--warning);
  border-color: var(--warning);
}
.notice.error {

  border-color: var(--danger);
  color: var(--danger);
}
.notice p {

}
.event-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.event-list li {
  padding: 15px 0;
  border-bottom: 1px solid var(--border);
}
.event-list li:first-child {
  padding-top: 0;
}
.event-list li:last-child {
  border: 0;
  padding-bottom: 0;
}
.member-button {

  gap: 10px;
  text-align: left;
  align-items: center;
  border: 0;
  background: transparent;
  padding: 0;
  color: var(--ink);
  font-weight: 700;
}
.member-button span {
  overflow-wrap: anywhere;
}
.chart {
  min-height: 220px;
}
.chart .apexcharts-tooltip {
  color: #172238 !important;
}
.intelligence-layout {

  grid-template-columns: 270px minmax(0, 1fr);
  gap: 22px;
  align-items: start;
}
.intelligence-directory {

  top: 174px;
}
.intelligence-directory-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;

}

}
.intelligence-directory-list {

.intelligence-directory-member {

.intelligence-directory-member:hover {

.intelligence-directory-member.selected {

}
.intelligence-directory-member .avatar {

}
.directory-member-info {

}
.directory-member-info > strong {

}
.directory-member-info > small {

.directory-member-info .badge {

.directory-member-progress {

.directory-member-progress strong,

}
.intelligence-stage {
  min-width: 0;
}
.member-profile-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px;
}
.member-profile-identity {

  align-items: center;
  gap: 14px;
  min-width: 0;
}
.member-profile-identity h2 {
  overflow-wrap: anywhere;
}
.member-profile-identity p {
  color: var(--muted);

  margin-top: 4px;
}
.member-profile-actions {

  align-items: start;
  flex-wrap: wrap;
}
.member-profile-kpis {

  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  grid-column: 1/-1;
}
.member-profile-kpis > div {

  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
}
.member-profile-kpis small {
  display: block;
  font-size: 11px;
}
.member-profile-kpis strong {
  display: block;
  font-size: 21px;
  margin-top: 4px;
}
.member-profile-strengths {

}
.member-progress-total {

}
.member-progress-total strong {

}
.member-progress-total small {
  display: block;
  margin-top: 4px;
}
.member-progress-graph {

  gap: 12px;
}
.member-progress-row {

  grid-template-columns: 110px minmax(0, 1fr) 65px;
  align-items: center;
  gap: 14px;
}
.member-progress-label {

  align-items: center;
  gap: 9px;
  font-size: 12px;
  font-weight: 700;
}
.member-progress-row > strong {
  font-size: 12px;
  text-align: right;
}
.member-progress-row > strong small {
  display: block;
  font-size: 10px;
}
.member-progress-row .progress {
  height: 10px;
}
.member-progress-row[data-event-type="Task"] .progress span {
  background: var(--accent);
}
.member-progress-row[data-event-type="Meet"] .progress span {
  background: #245ac5;
}
.member-progress-row[data-event-type="Learning"] .progress span {
  background: var(--success);
}
.member-progress-row[data-event-type="Skill"] .progress span {
  background: #a9327e;
}
.dark .member-progress-row[data-event-type="Meet"] .progress span {
  background: #9cbbff;
}
.dark .member-progress-row[data-event-type="Skill"] .progress span {
  background: #eeb8dc;
}
.member-radar-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}
.member-skill-card {

  padding: 18px;

  border-radius: 14px;
  background: var(--surface);
}
.member-skill-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}
.member-skill-heading h3 {
  font-size: 14px;
  color: var(--accent);
}
.member-strengths {
  min-height: 88px;
}
.member-strengths > small {
  display: block;
  margin-bottom: 5px;
}
.member-strengths > div {
  display: flex;
  gap: 12px;
  justify-content: space-between;
  font-size: 11px;
  margin-bottom: 6px;
}
.member-strengths strong {
  white-space: nowrap;
}
.member-learning-caption {
  font-size: 12px;

}
.member-skill-card .chart {
  min-height: 270px;

}
.member-rating-details,
.member-contact-details {

  padding-top: 13px;

}
.member-rating-details summary,
.member-contact-details summary {

  color: var(--accent);
  font-weight: 700;
}
.member-profile-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  margin-top: 18px;
}
.member-profile-fields p {
  overflow-wrap: anywhere;
}
.member-profile-summary > p {
  font-size: 13px;
}
.skills-member-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: center;
  margin-bottom: 24px;
}
.skills-member-picker .field {
  min-width: 230px;
}
.requirements-group {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  min-width: 0;
}
.requirements-group legend {
  color: var(--accent);
  font-weight: 700;
}
.requirement-editor-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 100px;
  gap: 15px;
  align-items: center;
  padding: 9px 0;
}
.requirement-editor-row .input {
  min-width: 0;
  font-size: 11px;
}
.meeting-group-heading {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 15px;
}
.meeting-schedule {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--subtle);
  border-radius: 12px;
}
.meeting-schedule strong,
.meeting-schedule small {
  display: block;
}
.meeting-schedule.upcoming {
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent);
}
.meeting-schedule.upcoming small {
  color: var(--accent);
}
.event-card.upcoming-meeting {

}
.board-hint {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 14px;
}
.event-card[draggable="true"] {

}
.event-card[draggable="true"]:active {
  cursor: grabbing;
}
.task-column.drop-target {
  outline: 2px dashed var(--accent);
  background: var(--accent-soft);
}
.event-card footer select {
  max-width: 130px;
  min-width: 0;
  font-size: 11px;
  padding: 6px;
}
.member-profile-lists {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 20px;
  align-items: start;
}
.profile-list-card {
  min-width: 0;
  grid-column: span 2;
  margin: 0;
  padding: 20px;
  border: 1px solid var(--border);
  border-top-color: var(--team-accent);
  border-radius: 16px;
  background: var(--surface);
}
.profile-list-card:nth-child(-n + 2) {
  grid-column: span 3;
}
.profile-list-card legend {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 11px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--team-tint);
  color: var(--team-accent);
  font-size: 11px;
  font-weight: 700;
}
.profile-list-card > p {
  font-size: 12px;
  margin: 8px 0;
}
.profile-list-group + .profile-list-group {

}
.profile-list-group h3 {
  margin: 4px 0 12px;
  font-size: 12px;
}
.profile-list-group ul {
  margin: 0;
  padding-inline-start: 18px;
  list-style: disc;
}
.profile-list-group li {
  padding: 4px 0;
  font-size: 12px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.profile-list-group li::marker {
  color: var(--team-accent);
}
@media (max-width: 700px) {

    grid-template-columns: 1fr;

  .profile-list-card,
  .profile-list-card:nth-child(-n + 2) {
    grid-column: auto;
  }
}
@media (max-width: 1100px) {

  }

  .member-profile-kpis strong {

  .member-progress-row {

  }

.track-header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 18px;
  margin-bottom: 18px;
}
.track {
  margin-bottom: 20px;
}
.skill-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.skill-item:last-child {
  border: 0;
}
.skill-item .row {
  font-size: 12px;
  margin-bottom: 7px;
}
.timeline-time {
  white-space: nowrap;
  font-size: 11px;
  color: var(--muted);
}
.details-json {

  font-size: 11px;
  color: var(--muted);
}
.page-footer {
  max-width: 1440px;
  margin: auto;
  padding: 18px 32px 28px;

  font-size: 11px;

}
dialog {
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  color: var(--ink);
  width: min(620px, calc(100% - 32px));
  max-height: calc(100dvh - 40px);
  padding: 0;
  box-shadow: 0 24px 80px #0004;
}
dialog::backdrop {
  background: #101b32a3;
  backdrop-filter: blur(3px);
}
.dialog-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
}
.dialog-body {
  padding: 24px;
}
.dialog-footer {
  padding-top: 18px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  border-top: 1px solid var(--border);
  margin-top: 22px;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  min-width: 0;
}
.field.full {
  grid-column: 1/-1;
}
.field small {
  font-size: 11px;
  font-weight: 400;
}
.members-picker {
  max-height: 190px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 8px;
}
.check-label {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.check-label input {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
  flex: none;
}
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--surface);
  border-radius: 12px;
  padding: 13px 20px;
  box-shadow: var(--shadow);

  position: relative;

.hierarchy-head:after {
  content: "";

  height: 30px;
  width: 1px;
  background: var(--border);
  bottom: -31px;
  left: 50%;

  border-radius: 14px;
  background: var(--surface);
  padding: 22px;

  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.hierarchy-person {
  padding: 13px;

  border-radius: 10px;
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.hierarchy-person.you,
.hierarchy-head.you {

  background: var(--accent-soft);

.hierarchy-person .name {
  font-size: 12px;

  gap: 12px;
  flex-wrap: wrap;

.preview-banner select {

  min-height: 32px;

.export-tools {

:root {
  font-family: "Plus Jakarta Sans", "Noto Sans Arabic", Arial, sans-serif;
}
.table-scroll {
  max-height: 540px;
}
th {
  position: sticky;
  top: 0;
  z-index: 2;
}
th.sticky-col {
  z-index: 3;
}
/* A consistent premium surface, with effects that leave text and focus readable. */
body {
  background-image:
    radial-gradient(ellipse at 8% 10%, #a48be714, transparent 42%),
    radial-gradient(ellipse at 95% 45%, #38b8a40a, transparent 40%);
  background-attachment: fixed;
}
.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(18px);
  box-shadow: 0 5px 22px #17223806;
}
.dark .app-header {
  background: rgba(25, 34, 51, 0.96);
  box-shadow: 0 5px 24px #0002;
}
.brand-mark {
  position: relative;
  background-color: #5931b6;
  background-image: linear-gradient(140deg, #7040d4, #42278d);
  box-shadow: 0 5px 16px #5931b630;
  overflow: hidden;
}
.brand-mark:after {
  content: "";
  position: absolute;
  inset: -20px;
  background: linear-gradient(
    120deg,
    transparent 25%,
    #ffffff30 50%,
    transparent 75%
  );
  transform: translateX(-100%);
  transition: transform 0.7s;
}
.brand:hover .brand-mark:after {
  transform: translateX(100%);
}
.tab {
  position: relative;
  border-radius: 9px 9px 0 0;
  transition:
    color 0.18s,
    background 0.18s;
}
.tab.active {
  background: linear-gradient(0deg, var(--accent-soft), transparent 95%);
}
.tab.active:after {
  content: "";
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: -3px;
  height: 3px;
  border-radius: 4px;
  background: var(--accent);
  box-shadow: 0 -2px 12px #7553c825;
}
.button {
  transition:
    transform 0.18s,
    box-shadow 0.18s,
    background 0.18s,
    border-color 0.18s;
}
.button:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 5px 14px #1722380c;
}
.button:active:not(:disabled) {
  transform: translateY(0);
}
.button.primary {
  background-color: #5931b6;
  background-image: linear-gradient(115deg, #5931b6, #7040d4);
  border-color: #7040d4;
  box-shadow: 0 4px 12px #5931b624;
}
.button.primary:hover {
  background-color: #482592;
  background-image: linear-gradient(115deg, #482592, #5931b6);
  box-shadow: 0 7px 18px #5931b632;
}
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 36px 40px;
  min-height: 230px;
  border: 1px solid #504078;
  border-radius: 22px;
  background-color: #201b3b;
  background-image:
    radial-gradient(ellipse at 93% 0%, #335a604d, transparent 52%),
    radial-gradient(ellipse at 16% 100%, #57319566, transparent 58%),
    linear-gradient(115deg, #181f35, #302256 58%, #203e42);
  box-shadow: 0 14px 36px #32235618;
  align-items: center;
  gap: 28px;
}
.hero:before {
  content: "";
  position: absolute;
  z-index: -1;
  width: 360px;
  height: 360px;
  right: -50px;
  top: -80px;
  border: 1px solid #cab7ff26;
  border-radius: 50%;
  box-shadow:
    0 0 0 45px #cab7ff08,
    0 0 0 90px #cab7ff05;
  pointer-events: none;
}
.hero:after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  background-image: radial-gradient(#ded6f329 1px, transparent 1px);
  background-size: 22px 22px;
  mask-image: linear-gradient(100deg, transparent 50%, #0008);
  pointer-events: none;
}
.hero > div:first-child {
  flex: 1;
  min-width: 240px;
}
.hero h1 {
  font-size: clamp(28px, 3.5vw, 46px);
  color: #fff;
  margin-top: 13px;
  letter-spacing: -1.2px;
}
.hero .eyebrow {
  display: inline-flex;
  border: 1px solid #c9baff45;
  border-radius: 20px;
  background: #ffffff0b;
  color: #e2d5ff;
  padding: 5px 11px;
  font-size: 10px;
  letter-spacing: 1.5px;
}
.hero p:not(.eyebrow) {
  color: #dae2f2;
  max-width: 520px;
  font-size: 13px;
  line-height: 1.8;
  margin-top: 12px;
}
.hero-summary {
  width: 220px;
  padding: 23px 24px;
  background: rgba(16, 22, 40, 0.5);
  border: 1px solid #bdcaf137;
  border-radius: 16px;
  box-shadow: 0 8px 30px #0001;
  backdrop-filter: blur(10px);
}
.hero-summary .hero-value {
  color: #fff;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1.3;
}
.hero-summary .hero-caption {
  color: #dae2f2;
  font-size: 11px;
  margin: 6px 0 16px;
}
.hero-summary .button {
  background: #f5f0ff;
  color: #482592;
  border-color: #f5f0ff;
  font-size: 12px;
  width: 100%;
}
.panel {
  border-color: var(--border);
  box-shadow: 0 4px 22px #17223805;
}
.stat {
  position: relative;
  overflow: hidden;
  transition:
    transform 0.2s,
    box-shadow 0.2s,
    border-color 0.2s;
  --event-color: #5931b6;
}
.stat:before {
  content: "";
  position: absolute;
  top: 0;
  left: 20px;
  right: 20px;
  height: 3px;
  background: var(--event-color);
  border-radius: 0 0 5px 5px;
  opacity: 0.85;
}
.stat:after {
  content: "";
  position: absolute;
  width: 100px;
  height: 100px;
  top: -40px;
  right: -30px;
  background: radial-gradient(circle, var(--accent-soft), transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.stat > * {
  position: relative;
  z-index: 1;
}
.stat .row > .icon {
  width: 30px !important;
  height: 30px !important;
  padding: 6px;
  border-radius: 9px;
  background: var(--subtle);
  color: var(--event-color);
}
.stat:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 26px #32235610;
  border-color: var(--event-color);
}
.stat[data-event-type="Meet"] {
  --event-color: #245cbd;
}
.stat[data-event-type="Learning"] {
  --event-color: #167356;
}
.stat[data-event-type="Exam"] {
  --event-color: #94610b;
}
.stat[data-event-type="Skill"] {
  --event-color: #a22d74;
}
.dark .stat {
  --event-color: #c6b2ff;
}
.dark .stat[data-event-type="Meet"] {
  --event-color: #a3c2ff;
}
.dark .stat[data-event-type="Learning"] {
  --event-color: #9de4bd;
}
.dark .stat[data-event-type="Exam"] {
  --event-color: #f4d491;
}
.dark .stat[data-event-type="Skill"] {
  --event-color: #eeb8dc;
}
.stat .progress span {
  background: var(--event-color);
}
.event-card {
  position: relative;
  transition:
    transform 0.2s,
    box-shadow 0.2s,
    border-color 0.2s;
  box-shadow: 0 4px 18px #17223804;
}
.event-card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: 0 12px 30px #5931b610;
}
.event-card.completed:hover {
  border-color: var(--success);
  box-shadow:
    inset 4px 0 var(--success),
    0 12px 30px #12674412;
}
.hierarchy-branch {
  box-shadow: 0 5px 24px #17223805;
  background-image: radial-gradient(
    ellipse at 100% 0%,
    var(--accent-soft),
    transparent 40%
  );
}
.hierarchy-person {
  transition:
    border-color 0.18s,
    transform 0.18s;
  background: var(--surface);
}
.hierarchy-person:hover {
  border-color: var(--accent);
  transform: translateX(2px);
}
.table-scroll {
  box-shadow: 0 3px 14px #17223803;
}
tbody tr:not(.selected):hover td {
  background: var(--subtle);
}
.toast {
  border: 1px solid var(--border);
  box-shadow: 0 14px 40px #0003;
}
@media (max-width: 640px) {
  .hero {
    padding: 26px 22px;
    border-radius: 17px;
    gap: 20px;
  }
  .hero > div:first-child {
    min-width: 0;
  }
  .hero > .row,
  .hero-summary {
    width: 100%;

  .hero-summary {
    padding: 17px 20px;

  .hero-summary .button {

    padding: 5px 10px;
  }
  .hero p:not(.eyebrow) {
    font-size: 12px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    animation: none !important;
    transition: none !important;
  }
}

.orbit-line {

.momentum-dial {

.momentum-dial svg {

.momentum-dial circle {

.dial-track {

.dial-value {

.momentum-dial > div {

  <body>
    <div id="root"><p style="padding: 32px">Loading ASAR Team Hub…</p></div>
    <noscript>Enable JavaScript to use ASAR Team Hub.</noscript>
    <script>
      /* Shared by Apps Script, the local adapter and tests. No browser or GAS dependencies. */
const HubModel = (() => {
  const TYPES = ["Task", "Meet", "Learning", "Skill"];
  const EVENT_FORM_FIELDS = {
    Task: ["title", "description", "members", "status", "due"],
    Meet: [
      "title",
      "description",
      "members",
      "date",
      "link",
      "loggingEnabled",
      "due",
    ],
    Learning: [
      "title",
      "description",
      "members",
      "link",
      "trackName",
      "obligation",
      "due",
    ],
  };
  const EVENT_COLUMNS = {
    Task: [
      "Task Title",
      "Task description",
      "Assignees",
      "Status",
      "Due to Date",
      "Archived",
      "Event ID",
    ],
    Meet: [
      "Meeting title",
      "Date",
      "Description",
      "Attachments",
      "Invited/Assigned",
      "Logging Enabled",
      "Due to Date",
      "Archived",
      "Event ID",
    ],
    Learning: [
      "Topic name",
      "Link",
      "Track Name",
      "Obligability",
      "Invited/Assigned",
      "Due to Date",
      "Description",
      "Event ID",
    ],
  };
  const REVIEW_TYPES = ["Learning", "Meet"];
  const COMPLETION_STATES = ["Uncompleted", "Pending", "Completed"];
  const MAX_EVIDENCE_BYTES = 10 * 1024 * 1024;
  const completionStatus = (row) =>
    COMPLETION_STATES.includes(clean(row.Status))
      ? clean(row.Status)
      : "Completed";
  function validateUpload(upload) {
    assert(
      upload && typeof upload === "object",
      "Choose a PDF, PNG or JPEG evidence file, up to 10 MB.",
    );
    const name = clean(upload.name).replace(/[\\/\x00-\x1f]/g, "_");
    const signatures = {
      "application/pdf": "JVBERi0",
      "image/png": "iVBORw0KGgo",
      "image/jpeg": "/9j/",
    };
    const base64 = upload.base64;
    assert(
      name && name.length <= 200 && signatures[upload.mimeType],
      "Choose a PDF, PNG or JPEG evidence file.",
    );
    assert(
      typeof base64 === "string" &&
        base64.length <= Math.ceil(MAX_EVIDENCE_BYTES / 3) * 4 &&
        base64.length % 4 === 0 &&
        /^[A-Za-z0-9+/]+={0,2}$/.test(base64),
      "Invalid evidence file or file exceeds 10 MB.",
    );
    const size =
      (base64.length / 4) * 3 -
      (base64.endsWith("==") ? 2 : base64.endsWith("=") ? 1 : 0);
    assert(
      size > 0 &&
        size <= MAX_EVIDENCE_BYTES &&
        base64.startsWith(signatures[upload.mimeType]),
      "The file contents do not match the selected PDF or image format.",
    );
    return { name, mimeType: upload.mimeType, size };
  }
  const LABELS = {
    Task: "Tasks",
    Meet: "Meetings",
    Learning: "Learning",
    Skill: "Skills",
  };
  const TABLES = {
    Task: "tasks",
    Meet: "meet",
    Learning: "learning",
    Skill: "skillEvents",
  };
  const TITLES = {
    Task: "Task Title",
    Meet: "Meeting title",
    Learning: "Topic name",
    Skill: "Event Name",
  };
  const STATUS = ["Backlog", "Pending", "InProgress", "Blocked", "Completed"];
  const RATING_FIELDS = [
    "Hard Skill",
    "Soft Skill",
    "Technology",
    "Personality",
    "Abilities",
  ];
  const clean = (v) => String(v == null ? "" : v).trim();
  const norm = (v) =>
    clean(v)
      .normalize("NFKC")
      .toLowerCase()
      .replace(/[\s\-–—]+/g, " ");
  const list = (v) =>
    (Array.isArray(v) ? v : clean(v).split(/[\n,;]+/))
      .map(clean)
      .filter(Boolean);
  const id = (v) => clean(v).replace(/\.0+$/, "");
  const memberKey = (m) => id(m.ID) || norm(m.Mail) || norm(m.Name);
  const truth = (v) => ["true", "yes", "1"].includes(norm(v));
  const status = (v) =>
    ({
      backlog: "Backlog",
      pending: "Pending",
      inprogress: "InProgress",
      blocked: "Blocked",
      completed: "Completed",
      done: "Completed",
      complete: "Completed",
      closed: "Completed",
    })[norm(v).replace(/\s/g, "")] || "Pending";
  const dateOnly = (v) =>
    /^\d{4}-\d{2}-\d{2}/.test(clean(v)) ? clean(v).slice(0, 10) : "";
  const validDate = (v) =>
    /^\d{4}-\d{2}-\d{2}$/.test(clean(v)) &&
    !isNaN(Date.parse(v + "T00:00:00Z")) &&
    new Date(v + "T00:00:00Z").toISOString().slice(0, 10) === v;
  const number = (v) =>
    clean(v) !== "" && Number.isFinite(Number(v)) ? Number(v) : null;
  const activeMember = (member) =>
    !!member && !["false", "no", "0", "removed"].includes(norm(member.Active));
  const activeTeam = (db) => (db.team || []).filter(activeMember);
  const role = (m) => {
    const value = norm(m.Role || m.Rule);
    if (["team leader", "team lead"].includes(value)) return "Team Leader";
    if (["leader", "subteam leader", "sub team leader"].includes(value))
      return "Leader";
    return "Team member";
  };
  function resolveMember(db, token) {
    const wanted = norm(token);
    if (!wanted) return null;
    const matches = (db.allTeam || db.team || []).filter((m) =>
      [memberKey(m), m.Name, m.Mail, ...list(m.Aliases)].some(
        (v) => norm(v) === wanted,
      ),
    );
    return matches.length === 1 ? matches[0] : null;
  }
  function people(db, value) {
    return [
      ...new Map(
        list(value)
          .map((t) => resolveMember(db, t))
          .filter(activeMember)
          .map((m) => [memberKey(m), m]),
      ).values(),
    ];
  }
  function actor(db, email) {
    const matches = activeTeam(db).filter(
      (m) => norm(m.Mail) === norm(email) && norm(email),
    );
    return matches.length === 1 ? matches[0] : null;
  }
  function isAdmin(db, member) {
    if (!activeMember(member)) return false;
    return (db.admins || []).some((a) => {
      if (["false", "no", "0"].includes(norm(a.Enabled))) return false;
      // A supplied email takes precedence over a name; a misspelled email cannot grant access by name.
      return clean(a.Email)
        ? norm(a.Email) === norm(member.Mail)
        : clean(a.Name) &&
            memberKey(resolveMember(db, a.Name) || {}) === memberKey(member);
    });
  }
  function parseRatings(value) {
    const items = [];
    for (const match of clean(value).matchAll(/\{([^}]+)\}/g)) {
      const at = match[1].lastIndexOf(",");
      const label = clean(match[1].slice(0, at));
      const score = number(match[1].slice(at + 1));
      if (at >= 0 && label && score !== null && score >= 0 && score <= 10)
        items.push({ label, score, source: "Team sheet" });
    }
    return items;
  }
  function ratingCategory(db, label) {
    return (
      RATING_FIELDS.find(
        (field) =>
          (db.skills || []).some(
            (s) => norm(s[field]) === norm(label) && clean(label),
          ) ||
          (db.team || []).some((m) =>
            parseRatings(m[field]).some((i) => norm(i.label) === norm(label)),
          ),
      ) || "Hard Skill"
    );
  }
  const PROJECT_FIELDS = ["Hard Skill", "Soft Skill", "Technology"];
  const skillKey = (category, label) => category + ":" + norm(label);
  function projectSkills(db) {
    const items = new Map();
    const add = (category, label) => {
      if (clean(label))
        items.set(skillKey(category, label), { category, label: clean(label) });
    };
    (db.skills || []).forEach((s) =>
      PROJECT_FIELDS.forEach((field) => add(field, s[field])),
    );
    activeTeam(db).forEach((m) =>
      PROJECT_FIELDS.forEach((field) =>
        parseRatings(m[field]).forEach((i) => add(field, i.label)),
      ),
    );
    (db.skillRequirements || []).forEach((r) => add(r.Category, r.Skill));
    return [...items.values()];
  }
  function requiredSkills(db, member) {
    const items = new Map();
    PROJECT_FIELDS.forEach((category) =>
      parseRatings(member[category]).forEach((i) =>
        items.set(skillKey(category, i.label), {
          label: i.label,
          category,
          target: null,
        }),
      ),
    );
    (db.skillRequirements || [])
      .filter((r) => id(r["Member ID"]) === memberKey(member))
      .forEach((r) => {
        const key = skillKey(r.Category, r.Skill);
        if (truth(r.Required))
          items.set(key, {
            label: clean(r.Skill),
            category: r.Category,
            target: number(r["Target Score"]),
          });
        else items.delete(key);
      });
    return [...items.values()];
  }
  function events(db) {
    const result = [];
    const matchedLogs = new Set();
    TYPES.forEach((type) =>
      (db[TABLES[type]] || []).forEach((row, index) => {
        const title = clean(
          row[TITLES[type]] || (type === "Learning" ? row["Course Name"] : ""),
        );
        if (!title) return;
        const sourceId = id(row["Event ID"]);
        const candidates = (db.logs || []).filter(
          (l) =>
            clean(l["Event Type"]) === type &&
            (sourceId
              ? id(l["Source ID"]) === sourceId ||
                (!clean(l["Source ID"]) &&
                  norm(l["Event Name"]) === norm(title))
              : norm(l["Event Name"]) === norm(title)),
        );
        candidates.forEach((l) => matchedLogs.add(l));
        const log = candidates[0];
        result.push(
          makeEvent(
            db,
            type,
            title,
            sourceId || `${type.toLowerCase()}-row-${index + 2}`,
            row,
            candidates,
            log,
          ),
        );
      }),
    );
    const requirements = new Map();
    activeTeam(db).forEach((m) =>
      requiredSkills(db, m).forEach((r) => {
        const key = skillKey(r.category, r.label);
        if (!requirements.has(key))
          requirements.set(key, { ...r, members: [] });
        requirements.get(key).members.push(m);
      }),
    );
    requirements.forEach((r, key) => {
      const sourceId = "required-" + encodeURIComponent(key);
      const logs = (db.logs || []).filter(
        (l) =>
          clean(l["Event Type"]) === "Skill" && id(l["Source ID"]) === sourceId,
      );
      logs.forEach((l) => matchedLogs.add(l));
      const row = {
        "Event Name": r.label,
        "Event ID": sourceId,
        "Target Skill": r.label,
        "Skill Category": r.category,
        "Invited/Assigned": r.members.map((m) => clean(m.Name)).join("\n"),
        Requirement: true,
      };
      result.push(
        makeEvent(db, "Skill", r.label, sourceId, row, logs, logs[0]),
      );
    });
    (db.logs || []).forEach((log) => {
      const type = clean(log["Event Type"]);
      const sourceId = id(log["Source ID"]);
      const retiredRequirement =
        sourceId.startsWith("required-") && !matchedLogs.has(log);
      let retiredCategory = "Hard Skill";
      if (retiredRequirement) {
        try {
          retiredCategory = decodeURIComponent(sourceId.slice(9)).split(":")[0];
        } catch (_) {}
      }
      if (
        !matchedLogs.has(log) &&
        TYPES.includes(type) &&
        clean(log["Event Name"])
      )
        result.push(
          makeEvent(
            db,
            type,
            clean(log["Event Name"]),
            sourceId || `legacy-${id(log["Event ID"])}`,
            retiredRequirement
              ? {
                  Archived: "TRUE",
                  "Target Skill": log["Target Skill"] || log["Event Name"],
                  "Skill Category": log["Skill Category"] || retiredCategory,
                }
              : {},
            [log],
            log,
          ),
        );
    });
    return result;
  }
  function taskLinks(row) {
    try {
      const links = JSON.parse(clean(row["Evidence Links"]) || "[]");
      return Array.isArray(links)
        ? links.filter(
            (link) =>
              link &&
              clean(link.id) &&
              /^https?:\/\/[^\s]+$/i.test(clean(link.url)),
          )
        : [];
    } catch (_) {
      return [];
    }
  }
  function makeEvent(db, type, title, eventId, row, logs, log) {
    const assigned = clean(
      type === "Task"
        ? row.Assignees
        : row["Invited/Assigned"] || (log && log["Invited/Assigned"]),
    );
    const eligible = assigned
      ? people(db, assigned)
      : type === "Task"
        ? []
        : activeTeam(db);
    const key = `${type}:${eventId}`;
    const completions = (db.completions || []).filter(
      (c) => clean(c["Event ID"]) === key,
    );
    const legacyPeople = people(
      db,
      logs.map((l) => clean(l["Attendees/Completed"])).join("\n"),
    );
    // A legacy task status only describes the whole assignment. New task completion is per member.
    const identity = (token) => {
      const m = resolveMember(db, token);
      return m ? memberKey(m) : "unmatched:" + norm(token);
    };
    const currentIdentity = (token) => {
      const member = resolveMember(db, token);
      return !member || activeMember(member);
    };
    const eligibleIdentities = new Set(
      assigned
        ? list(assigned).filter(currentIdentity).map(identity)
        : eligible.map(memberKey),

          "Member ID": r.memberId,

        headId: structure.headId,

      Email: norm(member.Mail),

      /* Serialize requests and keep event drafts separate from confirmed server data. */
const HubSync = (() => {
  function create({
    model,
    getData,
    send,
    onData,
    onChange,
    onNotice,
    storage,
    makeId,
    now = () => new Date().toISOString(),
  }) {
    let tail = Promise.resolve();
    let jobs = [];
    let restored = false;
    const storageKey = "asar_event_drafts_v1";
    const owner = () => model.norm(getData()?.activeUserSession?.email);
    const eventId = (job) => job.type.toLowerCase() + "-" + job.payload.newId;
    const exists = (job, data) =>
      (data?.[model.TABLES[job.type]] || []).some(
        (row) => model.id(row["Event ID"]) === eventId(job),
      );
    const emit = () => {
      try {
        storage?.setItem(
          storageKey,
          JSON.stringify(
            jobs
              .filter((job) => job.state !== "saved")
              .map(({ id, owner, action, payload, type }) => ({
                id,
                owner,
                action,
                payload,
                type,
              })),
          ),
        );

        /* Memory still retains drafts when browser storage is unavailable. */
      }
      onChange(jobs.map((job) => ({ ...job })));
    };

      const result = tail.then(task);
      tail = result.catch(() => {});
      return result;
    };

      if (job.state === "saved") return;
      job.state = "saved";
      job.error = "";

        onNotice?.(`Saved “${job.payload.title}”.`, "success");
      const timer = setTimeout(() => {
        jobs = jobs.filter((item) => item !== job);
        emit();
      }, 8000);
      timer?.unref?.();
    };
    const accept = (data) => {
      onData(data);
      if (!restored) restore();
      jobs.forEach((job) => {
        if (exists(job, data)) saved(job);
      });
      emit();
    };

      const result = model.transition(
        getData(),
        job.owner,
        job.action,
        job.payload,
        now(),
      );
      job.event = model
        .events(result.db)
        .find((event) => event.type === job.type && event.id === eventId(job));
    };
    const dispatch = (job) =>
      run(async () => {
        if (job.state === "saved") return;
        try {
          if (owner() !== job.owner)
            throw new Error(
              "Switch back to the account that created this draft to retry.",
            );
          if (exists(job, getData())) {
            saved(job);
            emit();
            return;
          }
          job.state = "saving";
          emit();
          const result = await send(job.action, job.payload);
          if (!result?.success)
            throw new Error(
              result?.error || "The save could not be confirmed.",
            );

          if (job.state !== "saved")
            throw new Error(
              "The save could not be confirmed. Refresh or retry.",
            );
        } catch (error) {
          job.state = "failed";
          job.error = error.message || String(error);
          if (job.owner === owner())
            onNotice?.(
              `Couldn’t confirm “${job.payload.title}”. Your draft is kept in Event saves.`,
              "error",
            );
          emit();
        }
      });
    const enqueue = (action, payload) => {
      const type = action === "saveTask" ? "Task" : payload.type;
      if (
        !["saveTask", "saveEvent"].includes(action) ||
        !model.EVENT_FORM_FIELDS[type] ||
        payload.key
      )
        throw new Error("Only new events can be saved in the background.");
      const id = payload.newId || makeId();
      const currentOwner = owner();
      const duplicate = jobs.find(
        (job) => job.id === id && job.owner === currentOwner,
      );
      if (duplicate) return duplicate;
      const job = {
        id,
        owner: currentOwner,
        type,
        action,
        payload: { ...payload, newId: id },
        state: "queued",
        error: "",
      };
      preview(job); // Validate immediately; invalid forms stay open without a network request.
      jobs = [
        ...jobs
          .filter((item) => item.state !== "saved")
          .concat(jobs.filter((item) => item.state === "saved").slice(-3)),
        job,
      ];
      emit();
      dispatch(job);
      return job;
    };
    const retry = (id) => {
      const job = jobs.find((item) => item.id === id && item.owner === owner());
      if (!job || job.state !== "failed") return;
      try {
        preview(job);
      } catch (error) {
        job.error = error.message || String(error);
        emit();
        return;
      }
      job.state = "queued";
      job.error = "";
      emit();
      dispatch(job);
    };
    const restore = () => {
      if (restored) return;
      restored = true;
      let drafts;
      try {
        drafts = JSON.parse(storage?.getItem(storageKey) || "[]");
      } catch (_) {
        return;
      }
      if (!Array.isArray(drafts)) return;
      for (const draft of drafts) {
        if (
          !draft?.payload ||
          !model.EVENT_FORM_FIELDS[draft.type] ||
          !["saveTask", "saveEvent"].includes(draft.action) ||
          draft.payload.key ||
          !draft.payload.newId ||
          draft.id !== draft.payload.newId
        )
          continue;
        const job = {
          ...draft,
          state: "failed",
          error: "Save not confirmed after reload. Retry or refresh to check.",
        };
        if (job.owner === owner()) {
          try {
            preview(job);
          } catch (_) {
            /* Retain the submitted fields even if assignments have changed. */
          }
        }
        jobs.push(job);
        if (exists(job, getData())) saved(job);
      }
      emit();
    };
    const dismiss = (id) => {
      jobs = jobs.filter(
        (job) =>
          job.id !== id ||
          job.owner !== owner() ||
          ["queued", "saving"].includes(job.state),
      );
      emit();
    };
    return { run, accept, enqueue, retry, dismiss, restore };

    <script>
      /* Immediate local feedback for updates; only confirmed responses enter the source snapshot. */
const HubActions = (() => {
  function create({
    model,
    getData,
    send,
    schedule,
    accept,
    onView,
    onChange,
    onNotice,
    makeId,
    now = () => new Date().toISOString(),
  }) {
    let jobs = [];
    const active = (job) => ["queued", "saving"].includes(job.state);
    const owner = () => model.norm(getData()?.activeUserSession?.email);
    function apply(data, job) {
      if (job.action === "queueTelegramNotification") {
        if (
          !model.isAdmin(data, model.actor(data, job.owner)) ||
          !job.payload.receipt

          throw new Error(
            "Open the Telegram preview as an admin before sending.",
          );
        return data;
      }
      const result = model.transition(
        data,
        job.owner,
        job.action,
        job.payload,
        job.timestamp,
      );
      if (!result.unchanged) {
        const row = result.db.activity[result.db.activity.length - 1];
        const details = JSON.parse(row.Details || "{}");
        row.Details = JSON.stringify({
          ...details,
          outcome: "Saving",
          optimistic: true,
        });
      }
      return result.db;
    }
    function view() {
      let data = getData();
      if (!data) return data;
      for (const job of jobs) {
        if (!active(job) || job.owner !== owner()) continue;
        try {
          data = apply(data, job);
        } catch (_) {
          /* A failed dependency is handled by dispatch, without displaying a false result. */
        }
      }
      return { ...data, allTeam: data.team, team: model.activeTeam(data) };
    }
    function emit() {
      onChange(jobs.map((job) => ({ ...job })));
      onView(view());
    }
    function successMessage(job) {
      if (job.action === "completeEvent")
        return model.REVIEW_TYPES.includes(job.type)
          ? "Submission saved for admin review. Status: Pending."
          : "Completion saved.";
      return (
        {
          moveTask: "Task status saved.",
          updateSkillCompletion: "Skill result saved.",
          revertCompletion: "Status reset saved.",
          reviewSubmission: "Review saved.",
          addTaskLink: "Evidence link saved.",
          removeTaskLink: "Evidence link removed.",
          queueTelegramNotification: "Announcement queued for Telegram.",
          saveHierarchy: "Team distribution saved.",
          saveSkillRequirements: "Required skills saved.",
          removeMember: "Member removed from the active team.",
        }[job.action] || "Changes saved."
      );
    }
    function saved(job) {
      if (job.state === "saved") return;
      job.state = "saved";
      job.error = "";
      if (job.owner === owner()) onNotice?.(successMessage(job), "success");
      const timer = setTimeout(() => {
        jobs = jobs.filter((item) => item !== job);
        emit();
      }, 6000);
      timer?.unref?.();
    }
    function recorded(data, job) {
      return (data.activity || []).some((row) => {
        if (model.norm(row.Email) !== job.owner || row.Action !== job.action)
          return false;
        try {
          const details = JSON.parse(row.Details || "{}");
          return (
            details?.outcome === "Succeeded" && details.requestId === job.id
          );
        } catch (_) {
          return false;
        }

    }
    function confirmed(data) {
      jobs.forEach((job) => {
        if (active(job) && recorded(data, job)) saved(job);

      emit();
    }
    function dispatch(job) {
      schedule(async () => {
        if (!active(job)) return;

          if (owner() !== job.owner)
            throw new Error(
              "Switch back to the account that made this update before retrying.",
            );
          if (recorded(getData(), job)) {
            saved(job);
            emit();
            return;
          }

          job.state = "saving";
          emit();
          const result = await send(job.action, job.payload);
          if (!result?.success)
            throw new Error(
              result?.error || "The update could not be confirmed.",
            );
          saved(job);
          accept(result.data);
        } catch (error) {
          job.state = job.replacedBy ? "superseded" : "failed";
          job.error = error.message || String(error);
          if (job.owner === owner() && job.state === "failed")
            onNotice?.(
              `Couldn’t save “${job.title}”. The unconfirmed change was rolled back; retry from Event saves.`,
              "error",
            );
          emit();
        }
      });
    }
    function mutate(action, payload) {
      const data = view();
      const currentOwner = owner();
      const id = payload.newId || makeId();
      const duplicate = jobs.find(
        (job) => job.id === id && job.owner === currentOwner,
      );
      if (duplicate) return duplicate;
      const key =
        payload.key ||
        (data.completions || []).find(
          (row) => row["Submission ID"] === payload.submissionId,
        )?.["Event ID"] ||
        "";
      const event = key
        ? model.events(data).find((item) => item.key === key)
        : null;
      const job = {
        id,
        owner: currentOwner,
        kind: "update",
        action,
        payload: { ...payload, newId: id, commandId: id },
        timestamp: now(),
        key,
        type: event?.type || "intelligence",
        title:
          event?.title ||
          payload.title ||
          (action === "saveHierarchy"
            ? "Team distribution"
            : action === "saveSkillRequirements"
              ? "Required skills"

        state: "queued",
        error: "",

        [
          "moveTask",
          "saveTask",
          "saveEvent",
          "updateSkillCompletion",
          "saveHierarchy",
          "saveSkillRequirements",
        ].includes(action)

        job.channel = `${action}:${key || payload.memberId || "team"}`;
        jobs.forEach((older) => {

            older.owner === currentOwner &&
            older.channel === job.channel &&

      emit();
      dispatch(job);

    }
    function retry(id) {
      const job = jobs.find((item) => item.id === id && item.owner === owner());
      if (!job || job.state !== "failed" || job.replacedBy) return;
      try {
        apply(view(), job);
      } catch (error) {
        job.error = error.message || String(error);
        emit();
        return;
      }
      job.state = "queued";
      job.error = "";
      emit();
      dispatch(job);

      jobs = jobs.filter(
        (job) => job.id !== id || job.owner !== owner() || active(job),

})();

    <script>
      /* Public notification formatting only. Bot credentials belong in Script Properties. */
const HubTelegram = (() => {
  const types = ["Task", "Meet", "Learning"];
  const clean = (value) => String(value == null ? "" : value).trim();
  const clip = (value, max) => {
    const text = clean(value);
    return text.length > max ? text.slice(0, max - 1) + "…" : text;
  };
  function details(row) {
    try {
      const value = JSON.parse(row.Details || "{}");
      return value && !Array.isArray(value) && typeof value === "object"
        ? value
        : {};
    } catch (_) {
      return {};
    }
  }
  function creations(db) {
    return new Map(
      (db.activity || []).flatMap((row) => {
        const data = details(row);
        return ["saveTask", "saveEvent"].includes(row.Action) &&
          data.created === true &&
          types.includes(data.type)
          ? [[data.event, row]]
          : [];
      }),
    );
  }
  function deliveries(db) {
    return new Map(
      (db.activity || []).flatMap((row) => {
        const data = details(row);
        return row.Action === "telegramNotification" &&
          data.event &&
          data.telegram
          ? [[data.event, { ...data.telegram, actor: row.Email }]]
          : [];

    return /^https?:\/\/[^\s<>"']+$/i.test(text) ? text : "";

    const event = model.events(db).find((item) => item.key === key);

      throw new Error(
        "Only newly created tasks, meetings and courses can be announced.",
      );
    if (event.archived)
      throw new Error("Restore this event before announcing it.");
    const label = { Task: "task", Meet: "meeting", Learning: "course" }[
      event.type
    ];
    const lines = ["ASAR Team Hub · New " + label, "", clip(event.title, 240)];
    if (event.meetingDate)
      lines.push("Meeting date: " + event.meetingDate + " (Cairo)");
    if (event.due) lines.push("Due: " + event.due + " (Cairo)");
    if (event.type === "Task")
      lines.push(
        "Status: " +
          model.status(event.row.Status).replace("InProgress", "In progress"),
      );
    lines.push(
      "Assigned to: " +
        clip(
          event.eligible.map((member) => clean(member.Name)).join(", ") ||
            "No members assigned",
          700,
        ),
    );
    if (event.description) lines.push("", clip(event.description, 900));
    const link = url(event.row.Link || event.row.Attachments);
    if (link)
      lines.push(
        "",
        link.length <= 1000
          ? (event.type === "Meet" ? "Join meeting: " : "Course: ") + link
          : "Open Team Hub for the event link.",
      );
    else if (event.type === "Meet" && event.row.Attachments)
      lines.push("Location: " + clip(event.row.Attachments, 300));

    if (creator) lines.push("", "Created by: " + clip(creator.Name, 160));

      key,
      type: event.type,
      title: event.title,

    const rows = [];
    let row = [],
      cell = "",
      quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '"' && quoted && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else if (c === '"') quoted = !quoted;
      else if (c === "," && !quoted) {
        row.push(cell);
        cell = "";
      } else if ((c === "\n" || c === "\r") && !quoted) {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell);
        if (row.some((v) => v.trim())) rows.push(row);
        row = [];
        cell = "";

    if (cell || row.length) {
      row.push(cell);
      rows.push(row);

              `Could not load ${name}.csv (${response.status}). Rebuild the local database.`,

        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23",
        timeZoneName: "longOffset",
      })
        .formatToParts(new Date())
        .map((p) => [p.type, p.value]),
    );
    const timestamp = `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}${parts.timeZoneName.replace("GMT", "") || "Z"}`;
    let result;
    try {
      result = HubModel.transition(db, selected, action, payload, timestamp);
    } catch (error) {
      const row = HubModel.failureActivity(
        db,
        selected,
        action,
        payload,
        error,
        timestamp,
      );
      if (row) db.activity.push(row);
      throw error;
    }
    if (!result.unchanged && action === "completeEvent" && payload.upload) {
      const row = result.db.completions[result.db.completions.length - 1];
      const bytes = Uint8Array.from(atob(payload.upload.base64), (c) =>
        c.charCodeAt(0),
      );
      const url = URL.createObjectURL(
        new Blob([bytes], { type: payload.upload.mimeType }),
      );
      attachments.set(row["Submission ID"], url);
      row["Evidence File ID"] = "local-" + row["Submission ID"];
      row["Evidence URL"] = "local-evidence:" + row["Submission ID"];
    }
    db = result.db;
    return { success: true, data: snapshot(), unchanged: result.unchanged };
  }
  function select(email) {

    return snapshot();
  }
  function csv(key) {
    const headers = [
      ...new Set([
        ...Object.keys(parseCSV(LOCAL_SEED.csv[key])[0] || {}),
        ...db[key].flatMap(Object.keys),
      ]),
    ];
    const originalHeaders = (LOCAL_SEED.csv[key].split(/\r?\n/)[0] || "")
      .split(",")
      .filter(Boolean);
    if (!headers.length) headers.push(...originalHeaders);
    const quote = (v) =>
      '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    return (
      "\uFEFF" +
      [headers, ...db[key].map((r) => headers.map((h) => r[h]))]
        .map((r) => r.map(quote).join(","))
        .join("\r\n")
    );
  }
  return {
    load,
    command,
    select,
    csv,
    parseCSV,
    fileUrl: (id) => attachments.get(id) || "",
    sheets: LOCAL_SEED.sheets,

function CompletionEditor({ event, member, onSave, onClose, busy, error }) {
  const state = M.eventState(event, member, today());
  const updatingSkill = event.type === "Skill" && state.completed;
  const [evidence, setEvidence] = useState(
    updatingSkill ? state.submission?.Evidence || "" : "",
  );
  const [score, setScore] = useState(
    updatingSkill ? (state.submission?.Score ?? "") : "",
  );
  const [upload, setUpload] = useState(null);
  const [fileError, setFileError] = useState("");
  const [reading, setReading] = useState(false);
  const fileInput = useRef();
  const requestId = useRef(newRequestId());
  const reviewed = M.REVIEW_TYPES.includes(event.type);
  return (
    <Modal
      title={
        reviewed
          ? "Submit for review"
          : updatingSkill
            ? "Update skill result"
            : "Record your completion"
      }
      onClose={onClose}
      busy={busy || reading}
    >
      <form
        onSubmit={(e) => {
          e.preventDefault();
          if (reading || fileError) return;
          onSave(updatingSkill ? "updateSkillCompletion" : "completeEvent", {
            key: event.key,
            newId: requestId.current,
            evidence,
            score,
            ...(upload ? { upload } : {}),
          });
        }}
        className="stack"
      >
        <div>
          <span className="badge accent">{M.LABELS[event.type]}</span>
          <h3 style={{ marginTop: 10 }}>{event.title}</h3>

            {reviewed ? "Submission for " : "Completion will be recorded for "}
            <strong dir="auto">{member.Name}</strong>.
          </p>
          {reviewed && (
            <p className="muted">
              Your status stays Pending until an admin approves. You can
              withdraw or undo it later.
            </p>
          )}
        </div>
        {reviewed && (
          <label className="field evidence-upload">
            {event.type === "Learning"
              ? "Course evidence file (optional)"
              : "Attendance evidence file (optional)"}
            <input
              type="file"
              ref={fileInput}
              accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg"
              disabled={busy || reading}
              onChange={async (e) => {
                const file = e.target.files[0];
                setUpload(null);
                setFileError("");
                if (!file) return;
                if (file.size > M.MAX_EVIDENCE_BYTES) {
                  setFileError("Choose a file up to 10 MB.");
                  return;
                }
                setReading(true);
                try {
                  const dataUrl = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () =>
                      reject(new Error("The file could not be read."));
                    reader.readAsDataURL(file);
                  });
                  const value = {
                    name: file.name,
                    mimeType: file.type,
                    base64: dataUrl.slice(dataUrl.indexOf(",") + 1),
                  };
                  M.validateUpload(value);
                  setUpload(value);
                } catch (err) {
                  setFileError(err.message);
                } finally {
                  setReading(false);
                }
              }}
            />
            <small>
              Certificate, result or screenshot · PDF, PNG or JPEG · up to 10
              MB. You can submit without a file.
            </small>
            {upload && (
              <span className="badge success">Ready: {upload.name}</span>
            )}
            {(upload || fileError) && (
              <Button
                type="button"
                className="small"

              <small>

              min="0"
              max="10"
              step="0.1"

              onChange={(e) => setScore(e.target.value)}
            />
            <small>
              A recorded level updates your skill matrix and profile lists.

          <Notice kind="error">{error || fileError}</Notice>
        )}
        <div className="dialog-footer">
          <Button type="button" onClick={onClose} disabled={busy}>
            Cancel
          </Button>
          <Button
            type="submit"
            className="primary"
            disabled={busy || reading || !!fileError}
            icon="check-circle"
          >
            {busy
              ? "Saving…"
              : reading
                ? "Reading file…"
                : reviewed
                  ? "Submit for review"
                  : updatingSkill
                    ? "Save skill result"
                    : "Confirm completion"}
          </Button>
        </div>
      </form>
    </Modal>
  );

function TelegramPreview({ eventKey, onLoad, onQueue, onClose, busy, error }) {
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  useEffect(() => {
    let active = true;
    onLoad(eventKey)
      .then((data) => {
        if (active) setResult(data);
      })
      .catch((e) => {
        if (active) setLoadError(e.message || String(e));
      })
      .finally(() => {
        if (active) setLoading(false);
      });
    return () => {
      active = false;
    };
  }, [eventKey]);
  return (
    <Modal title="Preview Telegram announcement" onClose={onClose} busy={busy}>
      <div className="stack telegram-preview">
        <p className="muted">
          Nothing is posted until an admin confirms. Event saving is separate
          from Telegram delivery.
        </p>
        {loading && <p role="status">Preparing your preview…</p>}
        {(loadError || error) && (
          <Notice kind="error">{loadError || error}</Notice>
        )}
        {result && (
          <>
            <div className="row spread">
              <span className="badge accent">
                <Icon name="send" size={14} />
                {result.chatTitle}
              </span>
              {result.delivery && (
                <span className="badge">{result.delivery.status}</span>
              )}
            </div>
            <div className="telegram-message">
              <pre dir="auto">{result.preview.text}</pre>
              {safeUrl(result.preview.url) && (
                <a
                  className="button small"
                  href={result.preview.url}
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Open Team Hub
                  <Icon name="external-link" size={14} />
                </a>
              )}
            </div>
            {result.delivery?.status === "Unconfirmed" && (
              <Notice kind="warning">
                Telegram did not confirm the earlier attempt. Check the group
                before sending again; it may already be there.
              </Notice>
            )}
            {result.delivery?.error && (
              <p className="save-error">{result.delivery.error}</p>
            )}
            <p className="muted">{result.reason}</p>
            <div className="row modal-actions">
              <Button onClick={onClose} disabled={busy}>
                Close preview
              </Button>
              {result.canSend && (
                <Button
                  className="primary"
                  icon="send"
                  disabled={busy}
                  onClick={() =>
                    onQueue("queueTelegramNotification", {
                      key: eventKey,
                      receipt: result.receipt,
                    })
                  }
                >
                  {busy ? "Queueing…" : "Send to Telegram"}
                </Button>
              )}
            </div>
            {result.canSend && (
              <small className="muted">
                Delivery runs in the background, usually within a minute. The
                message above is the exact text that will be sent.
              </small>
            )}
          </>
        )}
      </div>
    </Modal>
  );
}

function EventTab({

  onReview,
  onReviewEvent,
  onTaskLink,
  onTelegramPreview,
  onArchive,
  onMove,
  jobs = [],
  busy,
}) {
  const [search, setSearch] = useState("");

  const [view, setView] = useState("board");
  const [dragKey, setDragKey] = useState("");
  const [dropTarget, setDropTarget] = useState("");
  const telegramCreations = useMemo(

    [db.activity],
  );
  const telegramDeliveries = useMemo(
    () => HubTelegram.deliveries(db),
    [db.activity],
  );
  const confirmed = M.events(db).filter((e) => e.type === type);
  const drafts = jobs.filter(
    (job) =>
      job.type === type &&
      job.state !== "saved" &&
      job.event &&
      !confirmed.some((event) => event.key === job.event.key),
  );
  const all = [...drafts.map((job) => job.event), ...confirmed];
  const visible = all.filter((e) => {
    const s = M.eventState(e, member, today());
    return (
      (filter === "archived" ? e.archived : !e.archived) &&
      (filter !== "mine" || s.eligible) &&
      (filter !== "completed" || s.completed) &&
      (filter !== "pending" ||
        (admin ? M.pendingReviews(db, [e]).length > 0 : s.pending)) &&
      (filter !== "open" || s.canComplete) &&
      M.norm(
        e.title +
          " " +
          e.description +
          " " +
          e.targetSkill +
          " " +
          (e.row["Track Name"] || ""),
      ).includes(M.norm(search))
    );
  });
  const card = (e) => (
    <EventCard
      key={e.key}
      event={e}
      member={member}
      admin={admin}
      onEdit={onEdit}
      onComplete={onComplete}
      onRevert={onRevert}
      onReview={onReviewEvent}
      onTaskLink={onTaskLink}
      onTelegramPreview={
        member && telegramCreations.has(e.key) ? onTelegramPreview : undefined
      }
      telegramStatus={telegramDeliveries.get(e.key)?.status || ""}
      onArchive={onArchive}
      onMove={onMove}
      onDrag={setDragKey}
      busy={busy}
      syncJob={drafts.find((job) => job.event.key === e.key)}
      pendingUpdate={jobs.some(
        (job) =>

          job.key === e.key &&

    <>
      <Heading
        eyebrow="Team workspace"
        title={M.LABELS[type]}
        description={
          type === "Task"
            ? admin

            : M.REVIEW_TYPES.includes(type)
              ? "Submit your work, track its review, and update it whenever needed. Only approved records count toward progress."

        {admin && (
          <Button
            className="primary"
            icon="plus"
            disabled={busy}
            onClick={() => onCreate(type)}
          >

          </Button>
        )}
      </Heading>
      {admin && M.REVIEW_TYPES.includes(type) && (
        <ReviewQueue db={db} type={type} onReview={onReview} busy={busy} />
      )}
      <div className="toolbar">
        <input
          className="input search"
          aria-label={`Search ${M.LABELS[type]}`}
          placeholder={`Search ${M.LABELS[type].toLowerCase()}…`}
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />

          <select
            className="filter"
            aria-label="Event filter"
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
          >
            <option value="all">All active</option>
            <option value="mine">Assigned to me</option>
            <option value="open">
              {type === "Task" ? "Open tasks" : "Ready to complete"}

            {M.REVIEW_TYPES.includes(type) && (

              <button

                onClick={() => setView("list")}
              >
                Cards
              </button>
            </div>
          )}
          <span className="muted">
            {visible.length} {visible.length === 1 ? "event" : "events"}
          </span>
        </div>
      </div>
      {!admin && (
        <div style={{ marginBottom: 20 }}>
          <Notice>
            Event settings are managed by the admins listed in the sheet.
            {type === "Task"
              ? " Task progress follows its board status."
              : M.REVIEW_TYPES.includes(type)

                : " Eligible members can record their completion."}
          </Notice>
        </div>
      )}

        <p className="board-hint">

        <div className="task-board">
          {M.STATUS.map((status) => (
            <section
              className={

                (dragKey && dropTarget === status ? "drop-target" : "")
              }
              key={status}
              data-task-status={status}
              onDragOver={(e) => {
                if (admin && !busy) {
                  e.preventDefault();
                  e.dataTransfer.dropEffect = "move";
                  setDropTarget(status);
                }
              }}
              onDragLeave={() => setDropTarget("")}
              onDrop={(e) => {
                e.preventDefault();
                const key = e.dataTransfer.getData("text/plain");
                if (admin && !busy && all.some((t) => t.key === key))
                  onMove(key, status);
                setDropTarget("");
                setDragKey("");
              }}
            >
              <h3>
                {status === "InProgress" ? "In progress" : status}
                <span className="badge">
                  {
                    visible.filter((e) => M.status(e.row.Status) === status)
                      .length
                  }
                </span>
              </h3>
              {visible
                .filter((e) => M.status(e.row.Status) === status)
                .map(card)}
            </section>
          ))}
        </div>
      ) : type === "Meet" ? (
        <div className="stack">
          {[true, false].map((upcoming) => {
            const rows = visible
              .filter(
                (e) => M.eventState(e, member, today()).upcoming === upcoming,
              )
              .sort((a, b) =>
                upcoming
                  ? a.meetingDate.localeCompare(b.meetingDate)
                  : b.meetingDate.localeCompare(a.meetingDate),
              );
            if (!rows.length) return null;
            return (
              <section key={String(upcoming)}>
                <div className="meeting-group-heading">
                  <h2>
                    {upcoming ? "Upcoming meetings" : "Today & past meetings"}
                  </h2>
                  <span className="badge">{rows.length}</span>
                </div>
                <div className="event-grid">{rows.map(card)}</div>
              </section>
            );
          })}
        </div>
      ) : type === "Learning" ? (
        tracks.map((track) => {
          const es = visible.filter(
            (e) => (M.clean(e.row["Track Name"]) || "Other learning") === track,
          );
          const mine = es.filter(
            (e) => M.eventState(e, member, today()).eligible,
          );
          const done = mine.filter(
            (e) => M.eventState(e, member, today()).completed,
          ).length;
          return (
            <section className="panel track" key={track}>
              <div className="track-header row spread">
                <div>
                  <p className="eyebrow">Learning track</p>
                  <h2>{track}</h2>
                </div>
                <div>
                  <strong>
                    {done} / {mine.length}
                  </strong>
                  <small> completed by you</small>
                </div>
              </div>
              <div className="event-grid">{es.map(card)}</div>
            </section>
          );
        })
      ) : (
        <div className="event-grid">{visible.map(card)}</div>
      )}
    </>
  );
}

function SkillRequirementsEditor({ db, member, onSave, onClose, busy, error }) {
  const required = M.requiredSkills(db, member);
  const [draft, setDraft] = useState(() =>
    M.projectSkills(db).map((s) => {
      const existing = required.find(
        (r) =>
          M.skillKey(r.category, r.label) === M.skillKey(s.category, s.label),
      );
      return { ...s, required: !!existing, target: existing?.target ?? "" };
    }),
  );
  return (
    <Modal title="Manage required skills" onClose={onClose} busy={busy}>
      <form
        onSubmit={(e) => {
          e.preventDefault();
          onSave("saveSkillRequirements", {
            memberId: M.memberKey(member),
            requirements: draft,
          });
        }}
        className="stack"
      >
        <p>
          Project skills required for <strong dir="auto">{member.Name}</strong>.
        </p>
        {M.PROJECT_FIELDS.map((category) => (
          <fieldset className="requirements-group" key={category}>
            <legend>{category}</legend>
            {draft
              .filter((r) => r.category === category)
              .map((r) => (
                <div
                  className="requirement-editor-row"
                  key={M.skillKey(category, r.label)}
                >
                  <label className="check-label">
                    <input
                      type="checkbox"
                      checked={r.required}
                      onChange={(e) =>
                        setDraft(
                          draft.map((i) =>
                            i === r ? { ...i, required: e.target.checked } : i,
                          ),
                        )
                      }
                    />
                    <span>{r.label}</span>
                  </label>
                  <input
                    className="input"
                    aria-label={`Target rating for ${category}: ${r.label}`}
                    type="number"
                    min="0"
                    max="10"
                    step="0.1"
                    placeholder="Target /10"
                    value={r.target}
                    disabled={!r.required}
                    onChange={(e) =>
                      setDraft(
                        draft.map((i) =>
                          i === r ? { ...i, target: e.target.value } : i,
                        ),
                      )
                    }
                  />
                </div>
              ))}
          </fieldset>
        ))}
        {error && <Notice kind="error">{error}</Notice>}
        <div className="dialog-footer">
          <Button type="button" onClick={onClose} disabled={busy}>
            Cancel
          </Button>
          <Button className="primary" type="submit" disabled={busy}>
            Save required skills
          </Button>
        </div>
      </form>
    </Modal>
  );
}
function SkillsPage({
  db,
  member,
  admin,
  onComplete,
  onRevert,
  onManage,
  busy,
  updates = [],
}) {
  const [selected, setSelected] = useState(
    member ? M.memberKey(member) : M.memberKey(db.team[0] || {}),
  );
  const [search, setSearch] = useState("");
  const selectedMember =
    db.team.find((m) => M.memberKey(m) === selected) || db.team[0];
  const all = useMemo(() => M.events(db), [db]);
  const groups = selectedMember ? M.skillGroups(db, selectedMember, all) : [];
  const required = selectedMember ? M.requiredSkills(db, selectedMember) : [];
  const mine =
    member &&
    selectedMember &&
    M.memberKey(member) === M.memberKey(selectedMember);
  const visible = required.filter((r) =>
    M.norm(r.label).includes(M.norm(search)),
  );
  const card = (r) => {
    const event = all.find(
      (e) =>
        e.requirement &&
        e.skillCategory === r.category &&
        M.norm(e.targetSkill) === M.norm(r.label),
    );
    const rating = groups
      .find((g) => g.name === r.category)
      ?.items.find((i) => M.norm(i.label) === M.norm(r.label));
    return (
      event && (
        <EventCard
          key={event.key}
          event={event}
          member={selectedMember}
          allowCompletion={!!mine}
          requirementTarget={r.target}
          admin={false}
          rating={rating}
          onComplete={onComplete}
          onRevert={onRevert}
          busy={busy}
          pendingUpdate={updates.some(
            (job) =>
              job.key === event.key && ["queued", "saving"].includes(job.state),
          )}
        />
      )
    );
  };
  return (
    <>
      <Heading
        eyebrow="Project capabilities"
        title="Skills"
        description="The project skills required for each member, with their recorded ratings and completion."
      ></Heading>
      <section className="panel skills-member-picker">
        <label className="field">
          Team member
          <select
            aria-label="Skills for member"
            value={selected}
            onChange={(e) => setSelected(e.target.value)}
          >
            {db.team.map((m) => (
              <option key={M.memberKey(m)} value={M.memberKey(m)}>
                {m.Name}
                {M.isAdmin(db, m) ? " · Admin" : ""}
              </option>
            ))}
          </select>
        </label>
        <input
          className="input search"
          aria-label="Search required skills"
          placeholder="Find a project skill..."
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
        {admin && selectedMember && (
          <Button
            icon="sliders-horizontal"
            onClick={() => onManage(selectedMember)}
            disabled={busy}
          >
            Manage required skills
          </Button>
        )}
        <span className="badge">{required.length} required skills</span>
      </section>
      <div className="stack">
        {M.PROJECT_FIELDS.map((category) => {
          const rows = visible.filter((r) => r.category === category);
          return (
            rows.length > 0 && (
              <section key={category}>
                <div className="meeting-group-heading">
                  <h2>
                    {category === "Technology"
                      ? "Technologies & tools"
                      : category === "Hard Skill"

                  <span className="badge">{rows.length}</span>
                </div>
                <div className="event-grid">{rows.map(card)}</div>

        })}
        {!visible.length && (
          <Empty title="No required skills found">

function MemberProfileLists({ member, groups }) {
  const recorded = (value) => {
    if (!M.clean(value)) return [];
    try {
      const parsed = typeof value === "string" ? JSON.parse(value) : value;
      if (Array.isArray(parsed))
        return parsed
          .filter((g) => g && Array.isArray(g.items))
          .map((g) => ({
            category: M.clean(g.category),
            items: g.items
              .filter((item) => typeof item === "string" && M.clean(item))
              .map((label) => ({ label: M.clean(label) })),
          }))
          .filter((g) => g.items.length);
    } catch (_) {
      /* Plain text and recorded rating columns are supported as well. */
    }
    const ratings = M.parseRatings(value);
    return [
      {
        category: "",
        items: ratings.length
          ? ratings
          : M.clean(value)
              .split(/\r?\n/)
              .map((label) => ({ label: M.clean(label) }))
              .filter((i) => i.label),
      },
    ];
  };
  const ratingGroups = (names) =>
    groups
      .filter((g) => names.includes(g.name) && g.items.length)
      .map((g) => ({
        category:
          names.length > 1
            ? g.name === "Hard Skill"
              ? "Hard skills"
              : "Soft skills"
            : "",
        items: g.items,
      }));
  const sections = [
    {
      name: "Technology",
      icon: "cpu",
      color: "purple",
      rows: ratingGroups(["Technology"]),
    },
    {
      name: "Skills",
      icon: "sparkles",
      color: "amber",
      rows: [
        ...recorded(member.Skills),
        ...ratingGroups(["Hard Skill", "Soft Skill"]),
      ],
    },
    {
      name: "Knowledge",
      icon: "book-open",
      color: "purple",
      rows: recorded(member.Knowledge),
    },
    {
      name: "Abilities",
      icon: "lightbulb",
      color: "blue",
      rows: ratingGroups(["Abilities"]),
    },
    {
      name: "Personality",
      icon: "heart-handshake",
      color: "teal",
      rows: ratingGroups(["Personality"]),
    },
  ].map((section) => ({
    ...section,
    rows: section.rows.length ? section.rows : recorded(member[section.name]),
  }));
  return (
    <section className="member-profile-lists" aria-label="Member profile lists">
      {sections.map((section) => (
        <fieldset
          className={"profile-list-card team-color-" + section.color}
          key={section.name}
          aria-label={section.name + " profile list"}
        >
          <legend>
            <Icon name={section.icon} size={15} />
            {section.name}
          </legend>
          {section.rows.length ? (
            section.rows.map((group, index) => (
              <div className="profile-list-group" key={index}>
                {group.category && <h3>{group.category}</h3>}
                <ul>
                  {group.items.map((item, i) => (
                    <li key={i} dir="auto">
                      {item.label}
                    </li>
                  ))}
                </ul>
              </div>
            ))
          ) : (
            <p className="muted">No {section.name.toLowerCase()} recorded.</p>
          )}
        </fieldset>
      ))}
    </section>
  );
}

    completeEvent: "Submitted completion",

    revertCompletion: "Undid or withdrew completion",
    reviewSubmission: "Reviewed submission",
    addTaskLink: "Added task evidence",

          if (!details || typeof details !== "object" || Array.isArray(details))
            details = {};
          const actor = M.resolveMember(db, row.Email);
          const failed = ["Failed", "Unconfirmed"].includes(details?.outcome);
          const group = failed
            ? "errors"
            : row.Action === "telegramNotification"
              ? "telegram"
              : [
                    "completeEvent",
                    "revertCompletion",
                    "updateSkillCompletion",
                    "attendEvent",
                    "logEvent",
                  ].includes(row.Action)
                ? "submissions"
                : row.Action === "reviewSubmission"
                  ? "reviews"
                  : ["addTaskLink", "removeTaskLink"].includes(row.Action)
                    ? "evidence"
                    : "management";
          let summary = actionLabels[row.Action] || row.Action;
          if (row.Action === "telegramNotification")
