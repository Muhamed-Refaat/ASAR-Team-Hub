    // A lightweight Lucide Icon component for React
    const Icon = ({ name, className = "w-5 h-5", strokeWidth = 2 }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = '';
          const iconEl = window.lucide.createIcons({
            attrs: {
              class: className,
              'stroke-width': strokeWidth
            },
            name: name
          });
          // Appends the created SVG to the element
          if (iconEl && iconEl[name]) {
            ref.current.appendChild(iconEl[name].cloneNode(true));
          }
        }
      }, [name, className, strokeWidth]);

      return <span ref={ref} className="inline-flex items-center justify-center" />;
    };

    // Card Container wrapper following the SaaS Minimalist style
    const Card = ({ children, className = "" }) => (
      <div class={`bg-white border border-slate-100 rounded-2xl shadow-saas p-6 transition-all duration-300 hover:shadow-saas-lg ${className}`}>
        {children}
      </div>
    );

    // Modal wrapper with soft backdrop and shadow-saas-modal
    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4">
          <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onClick={onClose}></div>
          <div class="relative bg-white rounded-3xl shadow-saas-modal border border-slate-100 max-w-lg w-full overflow-hidden p-6 sm:p-8 animate-in fade-in zoom-in duration-200">
            <div class="flex items-center justify-between mb-6">
              <h3 class="text-xl font-bold text-slate-900">{title}</h3>
              <button onClick={onClose} class="text-slate-400 hover:text-slate-600 transition-colors p-1.5 rounded-full bg-slate-50 hover:bg-slate-100">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>
            {children}
          </div>
        </div>
      );

    // Interactive Chart Components using ApexCharts in React refs

    // 1. Skill Radar Chart Component
    const SkillRadar = ({ data, categories, memberName }) => {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (!chartRef.current) return;

        const options = {
          chart: {
            type: 'radar',
            height: 280,
            toolbar: { show: false },
            dropShadow: {
              enabled: true,
              blur: 8,
              left: 1,
              top: 1,
              opacity: 0.03
            }
          },
          series: [{
            name: memberName,
            data: data
          }],
          labels: categories,
          colors: ['#8b5cf6'],
          fill: {
            opacity: 0.15,
            colors: ['#8b5cf6']
          },
          stroke: {
            show: true,
            width: 2,
            colors: ['#8b5cf6']
          },
          markers: {
            size: 4,
            colors: ['#8b5cf6'],
            strokeColor: '#fff',
            strokeWidth: 2
          },
          yaxis: {
            show: false,
            min: 0,
            max: 100,
            tickAmount: 5
          },
          grid: {
            padding: {
              top: -10,
              bottom: -10
            }
          },
          legend: { show: false }
        };

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        chartInstance.current = new ApexCharts(chartRef.current, options);
        chartInstance.current.render();

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
            chartInstance.current = null;
          }
        };
      }, [data, categories, memberName]);

      return <div ref={chartRef} class="w-full flex justify-center" />;
    };

        isDraggingRef.current = true;
        dragStateRef.current = !currentlyChecked;
        toggleMemberSelection(memberName, dragStateRef.current);
      };

        if (!isDraggingRef.current) return;
        toggleMemberSelection(memberName, dragStateRef.current);
      };

        setSetEventEntry(prev => {
          const isAlreadyAssigned = prev.assignedMembers.includes(memberName);

            return { ...prev, assignedMembers: [...prev.assignedMembers, memberName] };

        fetchData();
      }, []);

      // Normalizes name comparing: replace hyphen with spaces, lowercase, trim.
      const normalizeName = (name) => {
        if (typeof name !== 'string') return '';
        return name.toLowerCase().replace(/-/g, ' ').trim();
      };

      // Groups course database flat entries into structured tracks and calculates dynamic metrics
      const groupCoursesByTrack = (courses, logs, currentUser) => {
        const nameNorm = currentUser ? normalizeName(currentUser.Name) : '';
        const tracksMap = {};

        courses.forEach(course => {
          const trackIdRaw = course["Track ID"];
          const trackId = trackIdRaw !== undefined && trackIdRaw !== null && trackIdRaw !== '' ? parseFloat(trackIdRaw) : null;
          if (trackId === null || isNaN(trackId)) return;

          const trackName = (course["Track Name"] || 'Unassigned Track').trim().replace(/\n/g, '');
          const trackOverview = course["Track Overview"] || 'Track details are currently being scheduled.';
          const courseName = course["Course Name"] || course["Topic name"] || '';

          if (!tracksMap[trackId]) {
            tracksMap[trackId] = {
              trackId,
              trackName,
              trackOverview,
              courses: []
            };
          }

          if (trackOverview && (!tracksMap[trackId].trackOverview || tracksMap[trackId].trackOverview.startsWith('Track details are currently'))) {
            tracksMap[trackId].trackOverview = trackOverview;
          }

          if (courseName && courseName.trim()) {
            const isCompleted = logs.some(log => 
              (log["Event Type"] === 'Learning' || log["Event Type"] === 'Skill') && 
              normalizeName(log["Event Name"]) === normalizeName(courseName) &&
              log["Attendees/Completed"] && 
              log["Attendees/Completed"].split('\n').some(c => normalizeName(c) === nameNorm)
            );

            const isMandatory = (course["Mandatory/Optional"] || course["Obligability"] || '').trim().toLowerCase() === 'mandatory';
            const estimatedHours = parseFloat(course["Estimated Hours"]) || 0;
            const courseUrl = course["Course URL"] || course["Link"] || '';
            const platform = course["Platform"] || '';

            tracksMap[trackId].courses.push({
              courseName: courseName.trim(),
              isMandatory,
              estimatedHours,
              courseUrl,
              platform,
              isCompleted
            });
          }
        });

        const tracks = Object.values(tracksMap).sort((a, b) => a.trackId - b.trackId);

        tracks.forEach(track => {
          const totalCourses = track.courses.length;
          const completedCourses = track.courses.filter(c => c.isCompleted).length;
          const completionPercentage = totalCourses > 0 ? Math.round((completedCourses / totalCourses) * 100) : 0;

          const mandatoryCourses = track.courses.filter(c => c.isMandatory);
          const totalMandatory = mandatoryCourses.length;
          const completedMandatory = mandatoryCourses.filter(c => c.isCompleted).length;

          track.metrics = {
            totalCourses,
            completedCourses,
            completionPercentage,
            totalMandatory,
            completedMandatory
          };
        });

        return tracks;
      };

      // Renders the beautifully grouped learning tracks UI with colored borders and progress indicators
      const renderLearningTracks = (containerElement, courses, logs, currentUser) => {
        if (!containerElement) return;

        const groupedTracks = groupCoursesByTrack(courses, logs, currentUser);

        const trackThemeColors = [
          { border: 'border-orange-200 focus-within:border-orange-400', headerBg: 'bg-orange-50/50', badge: 'bg-orange-100 text-orange-800' },
          { border: 'border-blue-200 focus-within:border-blue-400', headerBg: 'bg-blue-50/50', badge: 'bg-blue-100 text-blue-800' },
          { border: 'border-emerald-200 focus-within:border-emerald-400', headerBg: 'bg-emerald-50/50', badge: 'bg-emerald-100 text-emerald-800' },
          { border: 'border-purple-200 focus-within:border-purple-400', headerBg: 'bg-purple-50/50', badge: 'bg-purple-100 text-purple-800' },
          { border: 'border-pink-200 focus-within:border-pink-400', headerBg: 'bg-pink-50/50', badge: 'bg-pink-100 text-pink-800' },
          { border: 'border-amber-200 focus-within:border-amber-400', headerBg: 'bg-amber-50/50', badge: 'bg-amber-100 text-amber-800' },
          { border: 'border-cyan-200 focus-within:border-cyan-400', headerBg: 'bg-cyan-50/50', badge: 'bg-cyan-100 text-cyan-800' },
          { border: 'border-indigo-200 focus-within:border-indigo-400', headerBg: 'bg-indigo-50/50', badge: 'bg-indigo-100 text-indigo-800' },
          { border: 'border-rose-200 focus-within:border-rose-400', headerBg: 'bg-rose-50/50', badge: 'bg-rose-100 text-rose-800' },
        ];

        const htmlContent = groupedTracks.map((track, index) => {
          const color = trackThemeColors[index % trackThemeColors.length];
          const hasCourses = track.courses.length > 0;
          const isMandatoryComplete = track.metrics.totalMandatory > 0 && track.metrics.completedMandatory === track.metrics.totalMandatory;

          const coursesHtml = hasCourses ? track.courses.map(course => `
            <div class="border rounded-xl p-5 flex flex-col justify-between transition-all duration-300 shadow-sm ${
              course.isCompleted
                ? 'border-emerald-200 bg-emerald-50/30'
                : 'border-slate-100 bg-white hover:border-brand-200 hover:shadow-saas'
            }">
              <div class="space-y-4">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-[9px] font-extrabold px-2 py-0.5 rounded-md uppercase tracking-wider ${
                      course.isMandatory
                        ? 'bg-rose-100 text-rose-700 border border-rose-200'
                        : 'bg-blue-100 text-blue-700 border border-blue-200'
                    }">
                      ${course.isMandatory ? 'MANDATORY' : 'OPTIONAL'}
                    </span>
                    <span class="text-[9px] font-extrabold text-slate-500 px-2 py-0.5 bg-slate-100 border border-slate-200 rounded-md uppercase tracking-wider">
                      ⏱ ${course.estimatedHours} Hours
                    </span>
                  </div>
                  
                  ${course.isCompleted ? `
                    <span class="text-[9px] font-extrabold text-emerald-700 px-2 py-0.5 bg-emerald-100 border border-emerald-200 rounded-md uppercase tracking-wider">
                      ✓ Done
                    </span>
                  ` : ''}
                </div>

                <div class="space-y-1">
                  <h4 class="text-sm font-extrabold text-slate-800 leading-snug">${course.courseName}</h4>
                  <p class="text-[11px] text-slate-400 font-medium leading-relaxed">
                    Accelerate skills in ${track.trackName} (${course.platform || 'General'}). Complete assignments to validate credentials.
                  </p>
                </div>
              </div>

              <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
                ${course.courseUrl ? `
                  <a href="${course.courseUrl}" target="_blank" class="text-[11px] font-bold text-brand-600 hover:text-brand-800 flex items-center gap-1 transition-colors group">
                    Launch Course
                    <span class="transform transition-transform group-hover:translate-x-1">→</span>
                  </a>
                ` : `
                  <span class="text-[10px] text-slate-400 font-semibold">Link Not Scheduled</span>
                `}
              </div>
            </div>
          `).join('') : `
            <div class="col-span-full border border-dashed border-slate-200 rounded-xl p-8 flex flex-col items-center justify-center text-center bg-slate-50/50">
              <span class="text-slate-300 text-3xl mb-2">📅</span>
              <h5 class="text-xs font-extrabold text-slate-700">Tracks Scheduled For Future Releases</h5>
              <p class="text-[10px] text-slate-400 font-bold max-w-xs mt-1 leading-relaxed">
                Course curriculum and assignments are currently being structured and will align with subsequent milestone phases.
              </p>
            </div>
          `;

          const dividerHtml = (index < groupedTracks.length - 1) ? `
            <div class="relative py-8">
              <div class="absolute inset-0 flex items-center" aria-hidden="true">
                <div class="w-full border-t border-dashed border-slate-200"></div>
              </div>
              <div class="relative flex justify-center">
                <span class="bg-[#fcfcfd] px-4 text-[10px] font-extrabold text-slate-400 uppercase tracking-widest border border-slate-100 rounded-full py-1 shadow-sm flex items-center gap-1.5">
                  🎯 NEXT MILESTONE PHASE
                </span>
              </div>
            </div>
          ` : '';

          return `
            <div class="border rounded-2xl p-6 bg-white shadow-saas space-y-6 ${color.border}">
              <div class="flex flex-col md:flex-row md:items-start justify-between gap-4 pb-4 border-b border-slate-100">
                <div class="space-y-1 md:max-w-[65%]">
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded-full ${color.badge}">
                      TRACK ${track.trackId}
                    </span>
                  </div>
                  <h3 class="text-base font-black text-slate-900 mt-1">${track.trackName}</h3>
                  <p class="text-xs text-slate-400 font-bold leading-relaxed">${track.trackOverview}</p>
                </div>
                
                <div class="flex flex-col items-end gap-1.5 min-w-[220px] text-right">
                  <div class="flex items-center gap-2">
                    <span class="text-[9px] font-extrabold px-2 py-0.5 rounded-md uppercase tracking-wider ${
                      isMandatoryComplete
                        ? 'bg-emerald-50 text-emerald-700 border border-emerald-100'
                        : 'bg-rose-50 text-rose-700 border border-rose-100'
                    }">
                      ${isMandatoryComplete ? '🟢' : '🔴'} ${track.metrics.completedMandatory}/${track.metrics.totalMandatory} Mand
                    </span>
                    <span class="text-xs font-extrabold text-slate-700">
                      ${track.metrics.completedCourses} of ${track.metrics.totalCourses} Courses
                    </span>
                  </div>
                  <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mt-1 relative">
                    <div class="bg-brand-500 h-full rounded-full transition-all duration-500" style="width: ${track.metrics.completionPercentage}%"></div>
                  </div>
                  <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">
                    ${track.metrics.completionPercentage}% Complete
                  </span>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                ${coursesHtml}
              </div>
            </div>

            ${dividerHtml}
          `;
        }).join('');

        containerElement.innerHTML = `<div class="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-300">${htmlContent}</div>`;
      };

      // Handler to switch simulated log in profile
      const handleUserChange = (userName) => {
        const found = teamData.team.find(t => normalizeName(t.Name) === normalizeName(userName));
        if (found) {
          setCurrentUser(found);
          localStorage.setItem('active_member_name', found.Name);
        }
      };

      // Handle submitting a custom set event by admin
      const handleSetSubmit = (e) => {
        e.preventDefault();
        
        if (!setEventEntry.name.trim() || !setEventEntry.dueDate) {
          alert("Event Name and Due Date are required.");
          return;
        }

        setSyncing(true);

        // Package data into a JSON object
        const payload = {
          action: "createEvent",
          type: setEventEntry.type,
          name: setEventEntry.name,
          dueDate: setEventEntry.dueDate,
          invitedList: setEventEntry.assignedMembers
        };

        const backendUrl = teamData.webAppUrl || "";

        if (backendUrl) {
          fetch(backendUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          })
          .then(() => {
            showToastNotification(`Successfully created new ${setEventEntry.type} event: "${setEventEntry.name}"`);
            setShowSetModal(false);
            setSetEventEntry({ type: 'Skill', name: '', dueDate: '', assignedMembers: [] });
            fetchData(true); // Dynamic refresh
          })
          .catch((err) => {
            console.error("POST request failed: ", err);
            triggerGoogleScriptSet(payload);
          });
        } else {
          triggerGoogleScriptSet(payload);
        }
      };

      const triggerGoogleScriptSet = (payload) => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              showToastNotification(`Successfully created new ${payload.type} event: "${payload.name}"`);
              setShowSetModal(false);
              setSetEventEntry({ type: 'Skill', name: '', dueDate: '', assignedMembers: [] });
              fetchData(true); // Dynamic refresh
            })
            .withFailureHandler((err) => {
              console.error(err);
              alert("Error setting event in backend");
              setSyncing(false);
            })
            .logEvent(payload.type, payload.name, payload.invitedList, payload.dueDate);
        } else {
          // Simulation for local development
          const newEvent = {
            "Event Type": payload.type,
            "Event ID": String(teamData.logs.length + 1),
            "Event Name": payload.name,
            "Invited/Assigned": payload.invitedList.join('\n'),
            "Attendees/Completed": "",
            "Due to Date": payload.dueDate
          };
          setTeamData(prev => ({
            ...prev,
            logs: [newEvent, ...prev.logs]
          }));
          showToastNotification(`[LOCAL SIM] Successfully created ${payload.type} event: "${payload.name}"`);
          setShowSetModal(false);
          setSetEventEntry({ type: 'Skill', name: '', dueDate: '', assignedMembers: [] });
          setSyncing(false);
        }
      };

      // Handle submitting a new event to Google Apps Script Log sheet
      const handleLogSubmit = (e) => {
        e.preventDefault();
        setSyncing(true);

        const invitees = teamData.team.map(t => t.Name); // default invite everyone

        // Package data into a JSON object as requested
        const payload = {
          type: newLogEntry.type,
          name: newLogEntry.name,
          dueDate: newLogEntry.dueDate,
          userName: activeUserSession.name,
          email: activeUserSession.email,
          invitees: invitees
        };

        const backendUrl = teamData.webAppUrl || "";

        if (backendUrl) {
          fetch(backendUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          })
          .then(() => {
            setShowLogModal(false);
            setEventSearchQuery('');
            setNewLogEntry({ type: 'Skill', name: '', dueDate: '' });
            fetchData(true); // Sync reload
          })
          .catch((err) => {
            console.error("POST request failed: ", err);
            // Fallback to google.script.run
            triggerGoogleScriptLog(payload, invitees);
          });
        } else {
          triggerGoogleScriptLog(payload, invitees);
        }
      };

      const triggerGoogleScriptLog = (payload, invitees) => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              setShowLogModal(false);
              setEventSearchQuery('');
              setNewLogEntry({ type: 'Skill', name: '', dueDate: '' });
              fetchData(true); // Sync reload
            })
            .withFailureHandler((err) => {
              console.error(err);
              alert("Error adding event to sheet");
              setSyncing(false);
            })
            .logEvent(payload.type, payload.name, invitees, payload.dueDate);
        } else {
          // Simulation for local development
          const newEvent = {
            "Event Type": payload.type,
            "Event ID": String(teamData.logs.length + 1),
            "Event Name": payload.name,
            "Invited/Assigned": invitees.join('\n'),
            "Attendees/Completed": "",
            "Due to Date": payload.dueDate
          };
          setTeamData(prev => ({
            ...prev,
            logs: [newEvent, ...prev.logs]
          }));
          setShowLogModal(false);
          setEventSearchQuery('');
          setNewLogEntry({ type: 'Skill', name: '', dueDate: '' });
          setSyncing(false);
        }
      };

      // Handle marking an event completed / logging attendance
      const handleAttendEvent = (eventId) => {
        if (!currentUser) return;
        setSyncing(true);

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(() => {
              fetchData(true);
            })
            .withFailureHandler((err) => {
              console.error(err);
              alert("Error registering attendance");
              setSyncing(false);
            })
            .attendEvent(eventId, currentUser.Name);
        } else {
          // Simulation
          setTeamData(prev => {
            const updatedLogs = prev.logs.map(log => {
              if (parseFloat(log["Event ID"]) === parseFloat(eventId)) {
                let list = log["Attendees/Completed"] ? log["Attendees/Completed"].split('\n') : [];
                if (!list.includes(currentUser.Name)) {
                  list.push(currentUser.Name);
                }
                return { ...log, "Attendees/Completed": list.join('\n') };
              }
              return log;
            });
            return { ...prev, logs: updatedLogs };
          });
          setSyncing(false);
        }
      };

      // Handle re-opening an overdue event
      const handleReopenSubmit = (e) => {
        e.preventDefault();
        if (!showReopenModal) return;
        setSyncing(true);

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler(() => {
              setShowReopenModal(null);
              setReopenDueDate('');
              fetchData(true);
            })
            .withFailureHandler((err) => {
              console.error(err);
              alert("Error re-opening event");
              setSyncing(false);
            })
            .reopenEvent(showReopenModal["Event ID"], reopenDueDate);
        } else {
          // Simulation
          setTeamData(prev => {
            const updatedLogs = prev.logs.map(log => {
              if (parseFloat(log["Event ID"]) === parseFloat(showReopenModal["Event ID"])) {
                return { ...log, "Due to Date": reopenDueDate };
              }
              return log;
            });
            return { ...prev, logs: updatedLogs };
          });
          setShowReopenModal(null);
          setReopenDueDate('');
          setSyncing(false);
        }
      };

      // Derived dynamic statistics and calculations for active profile
      const userProfileDetails = useMemo(() => {
        if (!currentUser) return null;

        const nameNorm = normalizeName(currentUser.Name);

        // 1. Task Statistics
        const userTasks = teamData.tasks.filter(t => {
          if (!t.Assignees) return false;
          return t.Assignees.split(',').some(assignee => normalizeName(assignee) === nameNorm);
        });
        const completedTasks = userTasks.filter(t => t.Status && t.Status.toLowerCase() === 'completed').length;
        const assignedTasksCount = userTasks.length;
        const pendingTasks = userTasks.filter(t => t.Status && (t.Status.toLowerCase() === 'pending' || t.Status.toLowerCase() === 'inprogress')).length;

        // 2. Learning Track Statistics
        const userLearningEvents = teamData.logs.filter(log => {
          if (log["Event Type"] !== 'Learning' && log["Event Type"] !== 'Skill') return false;
          const invited = log["Invited/Assigned"] ? log["Invited/Assigned"].split('\n') : [];
          return invited.some(inv => normalizeName(inv) === nameNorm);
        });
        const completedLearningCount = userLearningEvents.filter(log => {
          const completed = log["Attendees/Completed"] ? log["Attendees/Completed"].split('
') : [];
          return completed.some(comp => normalizeName(comp) === nameNorm);
        }).length;
        const invitedLearningCount = userLearningEvents.length;
        
        // Dynamic DB-aligned learning progress
        const totalCoursesInDb = teamData.learning.filter(track => track["Course Name"] || track["Topic name"]).length;
        const completedCoursesInDb = teamData.learning.filter(track => {
          const cName = track["Course Name"] || track["Topic name"];
          if (!cName) return false;
          return teamData.logs.some(log => 
            (log["Event Type"] === 'Learning' || log["Event Type"] === 'Skill') && 
            normalizeName(log["Event Name"]) === normalizeName(cName) &&
            log["Attendees/Completed"] && 
            log["Attendees/Completed"].split('
').some(c => normalizeName(c) === nameNorm)
          );
        }).length;
        const learningProgress = totalCoursesInDb > 0 ? Math.round((completedCoursesInDb / totalCoursesInDb) * 100) : 0;

        // 3. Dynamic Skill radar generation
        const baseSkills = [...new Set([
          ...(teamData.skills || []).map(s => s["Skill Name"] || s["SkillName"] || s["skill name"]).filter(Boolean),
          'Leadership',
          'Communication',
          'Problem Solving'
        ])];
        const skillScores = baseSkills.map(subject => {
          let score = 40; // Base score

          // Boost if completed in Log sheet
          const matchingSkillLog = teamData.logs.find(log => 
            log["Event Type"] === 'Skill' && 
            normalizeName(log["Event Name"]) === normalizeName(subject)
          );

          if (matchingSkillLog) {
            const completedList = matchingSkillLog["Attendees/Completed"] ? matchingSkillLog["Attendees/Completed"].split('\n') : [];
            const invitedList = matchingSkillLog["Invited/Assigned"] ? matchingSkillLog["Invited/Assigned"].split('\n') : [];
            
            if (completedList.some(c => normalizeName(compName => compName === nameNorm))) {
              score = 95;
            } else if (invitedList.some(i => normalizeName(i) === nameNorm)) {
              const overdue = new Date(matchingSkillLog["Due to Date"]) < new Date();
              score = overdue ? 45 : 65;
            }
          }

          // Special modifiers
          if (subject === 'Leadership' && (currentUser.Rule && currentUser.Rule.toLowerCase().includes('lead') || currentUser.Rule && currentUser.Rule.toLowerCase().includes('supervisor'))) {
            score = 95;
          }
          if (subject === 'Communication' && completedTasks > 0) {
            score += Math.min(30, completedTasks * 10);
          }
          if (subject === 'Problem Solving' && completedTasks > 0) {
            score += Math.min(40, completedTasks * 15);
          }

          return { subject, score: Math.min(100, score) };
        });

        // 4. Meeting attendance
        const userMeets = teamData.logs.filter(log => log["Event Type"] === 'Meet');
        const attendedMeets = userMeets.filter(log => {
          const attendees = log["Attendees/Completed"] ? log["Attendees/Completed"].split('\n') : [];
          return attendees.some(att => normalizeName(att) === nameNorm);
        }).length;
        const invitedMeets = userMeets.filter(log => {
          const invited = log["Invited/Assigned"] ? log["Invited/Assigned"].split('\n') : [];
          return invited.some(inv => normalizeName(inv) === nameNorm);
        }).length;

        return {
          assignedTasksCount,
          completedTasks,
          pendingTasks,
          learningProgress,
          completedLearningCount,
          invitedLearningCount,
          skillScores,
          attendedMeets,
          invitedMeets
        };
      }, [currentUser, teamData]);

      // Calculate Team Contribution Data for Contribution Bar Chart
      const teamContributionData = useMemo(() => {
        if (!teamData.team || !teamData.tasks) return { categories: [], assigned: [], completed: [] };

        const categories = [];
        const assigned = [];
        const completed = [];

        teamData.team.slice(0, 10).forEach(member => {
          const nameNorm = normalizeName(member.Name);
          categories.push(member.Name.split('-')[0]); // Shorten name for readability
          
          const memberTasks = teamData.tasks.filter(t => {
            if (!t.Assignees) return false;
            return t.Assignees.split(',').some(assignee => normalizeName(assignee) === nameNorm);
          });
          assigned.push(memberTasks.length);
          completed.push(memberTasks.filter(t => t.Status && t.Status.toLowerCase() === 'completed').length);
        });

        return { categories, assigned, completed };
      }, [teamData]);

      // Derived global team metrics for the redesigned high-level dashboard
      const teamDashboardStats = useMemo(() => {
        if (!teamData.team || teamData.team.length === 0) {
          return {
            completionRate: 0,
            totalLearningHours: 0,
            activeTasksCount: 0,
            attendanceRate: 0,
            skillBlueprint: [],
            workspaceVelocity: { categories: [], completed: [], assigned: [] },
            taskDistribution: { completed: 0, inProgress: 0, toDo: 0 },
            learningTrackStats: { categories: [], enrolled: [], completed: [] },
            globalMilestones: []
          };
        }

        // 1. Total Workspace Completion Rate (completed vs total)
        const totalTasks = teamData.tasks ? teamData.tasks.length : 0;
        const completedTasks = teamData.tasks ? teamData.tasks.filter(t => t.Status && t.Status.toLowerCase() === 'completed').length : 0;
        const completionRate = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

        // 2. Total Team Learning Hours (hours of completed tracks by all members)
        let totalLearningHours = 0;
        if (teamData.team && teamData.learning && teamData.logs) {
          teamData.team.forEach(member => {
            const memberNameNorm = normalizeName(member.Name);
            teamData.learning.forEach(course => {
              const courseName = course["Course Name"] || course["Topic name"];
              if (!courseName) return;
              const isCompleted = teamData.logs.some(log => 
                (log["Event Type"] === 'Learning' || log["Event Type"] === 'Skill') && 
                normalizeName(log["Event Name"]) === normalizeName(courseName) &&
                log["Attendees/Completed"] && 
                log["Attendees/Completed"].split('\n').some(c => normalizeName(c) === memberNameNorm)
              );
              if (isCompleted) {
                const estimatedHours = parseFloat(course["Estimated Hours"]) || 5;
                totalLearningHours += estimatedHours;
              }
            });
          });
        }

        // 3. Active Team Tasks (marked inProgress / active across board)
        const activeTasksCount = teamData.tasks ? teamData.tasks.filter(t => {
          const statusNorm = t.Status ? t.Status.toLowerCase().replace(/\s+/g, '') : '';
          return statusNorm === 'inprogress' || statusNorm === 'active';
        }).length : 0;

        // 4. Overall Event Attendance (average attendance rate)
        let totalInvited = 0;
        let totalAttended = 0;

          teamData.logs.forEach(log => {
            if (log["Event Type"] === 'Meet' || log["Event Type"] === 'Skill') {
              const invited = log["Invited/Assigned"] ? log["Invited/Assigned"].split('\n').filter(n => n.trim().length > 0) : [];
              const attended = log["Attendees/Completed"] ? log["Attendees/Completed"].split('\n').filter(n => n.trim().length > 0) : [];

              totalAttended += attended.length;
            }
          });

        const attendanceRate = totalInvited > 0 ? Math.round((totalAttended / totalInvited) * 100) : 0;

        // 5. Team Skill Blueprint (Radar Chart)
        const baseSkills = [...new Set([
          ...(teamData.skills || []).map(s => s["Skill Name"] || s["SkillName"] || s["skill name"]).filter(Boolean),
          'Leadership',
          'Communication',
          'Problem Solving'
        ])];

        const skillBlueprint = baseSkills.map(subject => {
          let totalScore = 0;
          teamData.team.forEach(member => {
            const nameNorm = normalizeName(member.Name);
            const memberTasks = teamData.tasks ? teamData.tasks.filter(t => {
              if (!t.Assignees) return false;
              return t.Assignees.split(',').some(assignee => normalizeName(assignee) === nameNorm);

            const completedCount = memberTasks.filter(t => t.Status && t.Status.toLowerCase() === 'completed').length;
            
            let score = 40;

            const matchingSkillLog = teamData.logs ? teamData.logs.find(log => 
              log["Event Type"] === 'Skill' && 
              normalizeName(log["Event Name"]) === normalizeName(subject)
            ) : null;

            if (matchingSkillLog) {
              const completedList = matchingSkillLog["Attendees/Completed"] ? matchingSkillLog["Attendees/Completed"].split('\n') : [];
              const invitedList = matchingSkillLog["Invited/Assigned"] ? matchingSkillLog["Invited/Assigned"].split('\n') : [];
              
              if (completedList.some(c => normalizeName(c) === nameNorm)) {
                score = 95;
              } else if (invitedList.some(i => normalizeName(i) === nameNorm)) {

                score = overdue ? 45 : 65;

            if (subject === 'Leadership' && (member.Rule && member.Rule.toLowerCase().includes('lead') || member.Rule && member.Rule.toLowerCase().includes('supervisor'))) {

            if (subject === 'Communication' && completedCount > 0) {
              score += Math.min(30, completedCount * 10);
            }
            if (subject === 'Problem Solving' && completedCount > 0) {
              score += Math.min(40, completedCount * 15);
            }
            totalScore += Math.min(100, score);
          });

          const averageScore = teamData.team.length > 0 ? Math.round(totalScore / teamData.team.length) : 40;
          return { subject, score: averageScore };

        // 6. Global Workspace Velocity (Area Chart)

      // Compile full list of available events dynamically from teamData

      // Filter events logged for active user

      // Generate hexagonal skill ratings (1-10 scale) dynamically seeded by member's name and scaled by tasks/learning

          Math.min(10, (parseInt(member.CriticalThinkingRating) || seed4))
        ];

        const learningSkills = [

          Math.min(10, Math.max(1, (seed3 + tasksFactor))), // Tech Workshops
          Math.min(10, Math.max(1, (seed4 + learningFactor))), // Conceptual Ret.
          Math.min(10, Math.max(1, (seed5 + tasksFactor))), // Practical Apps
          Math.min(10, Math.max(1, (seed1 + learningFactor))), // Self-Study Pace
          Math.min(10, Math.max(1, (seed2 + 1))) // Alignment Meetings
        ];

        return {
          hard: hardSkills,

            ],
            technology: [

      };

      // Calculate member performance dynamic matrix for Team tab
      const getMemberMetrics = (member) => {

        const mLearningEvents = teamData.logs.filter(log => {

') : [];
          return completed.some(comp => normalizeName(comp) === nameNorm);
        }).length;
        
        // Dynamic DB-aligned learning progress

').some(c => normalizeName(c) === nameNorm)

        const learningProgress = totalCoursesInDb > 0 ? Math.round((completedCoursesInDb / totalCoursesInDb) * 100) : 0;

        const baseSkills = [...new Set([

                    <span class="font-extrabold text-lg text-slate-900 tracking-tight block">Azar Project Team</span>

                  </div>

              </div>
              <div class="text-xs font-semibold text-left">{toast}</div>
              <button onClick={() => setToast(null)} class="text-slate-400 hover:text-white transition-colors pl-2 flex items-center justify-center">
                <Icon name="x" className="w-3.5 h-3.5" />
              </button>
            </div>
          )}

        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
