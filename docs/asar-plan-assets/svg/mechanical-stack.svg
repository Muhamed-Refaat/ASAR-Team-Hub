<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">ASAR mechanical stack and sensor placement</title>
  <desc id="desc">A two-deck acrylic robot chassis is shown with four mecanum wheel positions, four ultrasonic sensor directions, a central IMU location and optional LiDAR/SBC placement. The drive firmware baseline is side differential; true mecanum translation requires the WSPD upgrade.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111c"/><stop offset="1" stop-color="#182d40"/></linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#253d55"/><stop offset="1" stop-color="#102232"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#fb7185"/></marker>
    <style>
      .h{font:700 25px Arial,sans-serif;fill:#e6fffb;letter-spacing:1px}.sub{font:400 13px Arial,sans-serif;fill:#afd0d7}.deck{fill:url(#deck);stroke:#5eead4;stroke-width:2}.wheel{fill:#18232e;stroke:#93c5fd;stroke-width:2}.roller{fill:#475569;stroke:#cbd5e1;stroke-width:1}.t{font:700 15px Arial,sans-serif;fill:#e6fffb}.s{font:400 12px Arial,sans-serif;fill:#c4e5e7}.xs{font:400 11px Arial,sans-serif;fill:#abc3ca}.future{fill:#40235b;stroke:#d8b4fe;stroke-width:2;stroke-dasharray:7 5}.ftext{font:700 13px Arial,sans-serif;fill:#f3e8ff}.sensor{stroke:#fb7185;stroke-width:2;fill:none;marker-end:url(#a)}.ground{stroke:#64748b;stroke-width:2;stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1200" height="660" fill="url(#bg)"/>
  <text x="42" y="45" class="h">MECHANICAL STACK + SENSOR PLACEMENT</text>
  <text x="42" y="70" class="sub">Use this as an installation checklist; dimensions, motor ratings and battery chemistry still need measured confirmation.</text>

  <g transform="translate(125 125)">
    <polygon points="120,80 380,15 680,100 410,190" fill="#0d1b28" stroke="#334e68" stroke-width="3"/>
    <polygon points="120,80 410,190 410,235 120,125" fill="#0a1724" stroke="#334e68" stroke-width="2"/>
    <polygon points="410,190 680,100 680,145 410,235" fill="#132638" stroke="#334e68" stroke-width="2"/>
    <polygon points="165,62 382,12 635,86 409,160" class="deck"/>
    <line x1="225" y1="50" x2="225" y2="156" class="ground"/><line x1="565" y1="55" x2="565" y2="160" class="ground"/>
    <line x1="310" y1="30" x2="310" y2="188" class="ground"/><line x1="490" y1="33" x2="490" y2="188" class="ground"/>
    <polygon points="220,155 410,205 600,147 409,98" fill="#294a61" stroke="#7dd3fc" stroke-width="2"/>
    <polygon points="220,155 409,205 409,230 220,180" fill="#193247" stroke="#7dd3fc" stroke-width="1.5"/>
    <polygon points="409,205 600,147 600,172 409,230" fill="#1e4058" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="355" y="122" width="110" height="37" rx="5" class="future"/>
    <text x="410" y="145" text-anchor="middle" class="ftext">LiDAR / SBC</text>
    <rect x="365" y="179" width="90" height="20" rx="4" fill="#b45309" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="410" y="193" text-anchor="middle" font-family="Arial" font-size="10" fill="#fffbeb">BATTERY LOW DECK</text>
    <circle cx="410" cy="180" r="7" fill="#a78bfa" stroke="#ede9fe"/><text x="410" y="248" text-anchor="middle" class="xs">IMU near rotation center</text>
    <g transform="translate(162 55)"><rect width="48" height="88" rx="18" class="wheel"/><ellipse cx="24" cy="19" rx="18" ry="7" class="roller"/><ellipse cx="24" cy="42" rx="18" ry="7" class="roller"/><ellipse cx="24" cy="65" rx="18" ry="7" class="roller"/></g>
    <g transform="translate(570 45)"><rect width="48" height="88" rx="18" class="wheel"/><ellipse cx="24" cy="19" rx="18" ry="7" class="roller"/><ellipse cx="24" cy="42" rx="18" ry="7" class="roller"/><ellipse cx="24" cy="65" rx="18" ry="7" class="roller"/></g>
    <g transform="translate(198 160)"><rect width="48" height="88" rx="18" class="wheel"/><ellipse cx="24" cy="19" rx="18" ry="7" class="roller"/><ellipse cx="24" cy="42" rx="18" ry="7" class="roller"/><ellipse cx="24" cy="65" rx="18" ry="7" class="roller"/></g>
    <g transform="translate(545 150)"><rect width="48" height="88" rx="18" class="wheel"/><ellipse cx="24" cy="19" rx="18" ry="7" class="roller"/><ellipse cx="24" cy="42" rx="18" ry="7" class="roller"/><ellipse cx="24" cy="65" rx="18" ry="7" class="roller"/></g>
    <text x="135" y="46" class="s">FL</text><text x="630" y="40" class="s">FR</text><text x="170" y="270" class="s">RL</text><text x="610" y="263" class="s">RR</text>
    <circle cx="410" cy="92" r="7" fill="#10b981" stroke="#d1fae5"/><text x="410" y="77" text-anchor="middle" class="xs">status LED</text>
    <path d="M410 78 V-5" class="sensor"/><text x="410" y="-18" text-anchor="middle" class="s">FRONT HC-SR04</text>
    <path d="M410 215 V300" class="sensor"/><text x="410" y="322" text-anchor="middle" class="s">REAR HC-SR04</text>
    <path d="M180 130 H60" class="sensor"/><text x="45" y="122" text-anchor="end" class="s">LEFT</text>
    <path d="M625 120 H760" class="sensor"/><text x="775" y="112" class="s">RIGHT</text>
    <text x="410" y="360" text-anchor="middle" class="t">Double-deck structure: heavy/power below; logic/sensors protected above</text>
  </g>

  <rect x="45" y="505" width="1110" height="110" rx="16" fill="#112537" stroke="#5eead4" stroke-width="1.5"/>
  <text x="70" y="540" class="t">Mechanical acceptance checklist</text>
  <text x="70" y="566" class="s">1. Confirm wheel roller orientation and motor polarity for FL/RL/FR/RR.</text>
  <text x="70" y="588" class="s">2. Mount IMU rigidly near the chassis center; use standoffs/damping without allowing movement.</text>
  <text x="650" y="566" class="s">3. Keep ultrasonic faces unobstructed and separated to limit cross-talk.</text>
  <text x="650" y="588" class="s">4. Baseline firmware = side differential; enable true Mecanum motion only after WSPD calibration.</text>
</svg>
