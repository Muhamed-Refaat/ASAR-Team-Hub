<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="430" viewBox="0 0 1300 430" role="img" aria-labelledby="title desc">
  <title id="title">ASAR staged delivery and learning loop</title>
  <desc id="desc">Five gated phases take the project from evidence and wiring through motor bring-up, communication, telemetry, app integration, and controlled autonomy. Each phase produces a measurable artifact and feeds lessons back into the next iteration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091322"/><stop offset="1" stop-color="#102c38"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#67e8f9"/></marker>
    <style>
      .h{font:700 25px Arial,sans-serif;fill:#e6fffb;letter-spacing:1px}.sub{font:400 13px Arial,sans-serif;fill:#a5c4c9}.card{fill:#123448;stroke:#67e8f9;stroke-width:2}.n{font:700 18px Arial,sans-serif;fill:#e6fffb}.s{font:400 12px Arial,sans-serif;fill:#c4e5e7}.g{font:700 11px Arial,sans-serif;fill:#a7f3d0}.gate{fill:#10242f;stroke:#34d399;stroke-width:2}.line{stroke:#67e8f9;stroke-width:3;fill:none;marker-end:url(#arrow)}.loop{stroke:#d8b4fe;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1300" height="430" fill="url(#bg)"/>
  <text x="45" y="48" class="h">STAGED DELIVERY + SELF-LEARNING LOOP</text>
  <text x="45" y="74" class="sub">Never move a physical risk downstream: each gate requires evidence, a log entry and a reversible rollback point.</text>

  <g transform="translate(45 125)">
    <rect width="210" height="170" rx="16" class="card"/><text x="105" y="34" text-anchor="middle" class="n">1 · Baseline</text><text x="105" y="62" text-anchor="middle" class="s">source audit + pin map</text><text x="105" y="84" text-anchor="middle" class="s">power / mechanical check</text><text x="105" y="116" text-anchor="middle" class="g">artifact: approved BOM</text><text x="105" y="137" text-anchor="middle" class="g">gate: G0 safety review</text>
  </g>
  <g transform="translate(290 125)">
    <rect width="210" height="170" rx="16" class="card"/><text x="105" y="34" text-anchor="middle" class="n">2 · Bring-up</text><text x="105" y="62" text-anchor="middle" class="s">motor-only / encoders</text><text x="105" y="84" text-anchor="middle" class="s">ultrasonic / MPU</text><text x="105" y="116" text-anchor="middle" class="g">artifact: T01 evidence</text><text x="105" y="137" text-anchor="middle" class="g">gate: G1 hardware</text>
  </g>
  <g transform="translate(535 125)">
    <rect width="210" height="170" rx="16" class="card"/><text x="105" y="34" text-anchor="middle" class="n">3 · Link</text><text x="105" y="62" text-anchor="middle" class="s">START/RDY + UART</text><text x="105" y="84" text-anchor="middle" class="s">malformed frame tests</text><text x="105" y="116" text-anchor="middle" class="g">artifact: T02–T14 log</text><text x="105" y="137" text-anchor="middle" class="g">gate: G2 protocol</text>
  </g>
  <g transform="translate(780 125)">
    <rect width="210" height="170" rx="16" class="card"/><text x="105" y="34" text-anchor="middle" class="n">4 · Operate</text><text x="105" y="62" text-anchor="middle" class="s">WebSocket app / relay</text><text x="105" y="84" text-anchor="middle" class="s">telemetry + safety UX</text><text x="105" y="116" text-anchor="middle" class="g">artifact: T15–T20</text><text x="105" y="137" text-anchor="middle" class="g">gate: G3 end-to-end</text>
  </g>
  <g transform="translate(1025 125)">
    <rect width="210" height="170" rx="16" class="card"/><text x="105" y="34" text-anchor="middle" class="n">5 · Autonomy</text><text x="105" y="62" text-anchor="middle" class="s">calibrated reactive FSM</text><text x="105" y="84" text-anchor="middle" class="s">optional SBC / SLAM</text><text x="105" y="116" text-anchor="middle" class="g">artifact: repeatable demo</text><text x="105" y="137" text-anchor="middle" class="g">gate: G4 scenario set</text>
  </g>
  <path d="M255 210 H290" class="line"/><path d="M500 210 H535" class="line"/><path d="M745 210 H780" class="line"/><path d="M990 210 H1025" class="line"/>
  <rect x="280" y="323" width="740" height="42" rx="21" class="gate"/>
  <text x="650" y="349" text-anchor="middle" class="s">After every gate: record observation → root cause → decision → next experiment → update plan</text>
  <path d="M1130 295 C1130 374 180 396 150 295" class="loop"/>
  <text x="640" y="416" text-anchor="middle" class="sub">The loop returns to the earliest failed gate; do not compensate for an unknown hardware fault with higher-level software.</text>
</svg>
