<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">ASAR wiring and power architecture</title>
  <desc id="desc">Four electrical domains are shown: fused battery power to motor drivers, measured logic power to controllers and sensors, a dedicated Raspberry Pi autonomy rail and a common star ground. Signal links show UART, PWM, encoder, ultrasonic, I2C, LiDAR and camera connections.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="power" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="logic" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#dc2626"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#15803d"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#1d4ed8"/></marker>
    <style>
      .h{font:700 26px Arial,sans-serif;fill:#0f172a;letter-spacing:1px}.sub{font:400 13px Arial,sans-serif;fill:#475569}.box{stroke:#334155;stroke-width:1.5}.t{font:700 15px Arial,sans-serif;fill:#0f172a}.s{font:400 12px Arial,sans-serif;fill:#334155}.xs{font:400 11px Arial,sans-serif;fill:#475569}.power{fill:url(#power)}.logic{fill:url(#logic)}.signal{fill:url(#signal)}.future{fill:#f3e8ff;stroke:#7e22ce;stroke-dasharray:7 5}.p{stroke:#dc2626;stroke-width:3;fill:none;marker-end:url(#redArrow)}.l{stroke:#15803d;stroke-width:2.5;fill:none;marker-end:url(#greenArrow)}.b{stroke:#1d4ed8;stroke-width:2;fill:none;marker-end:url(#blueArrow)}.ground{stroke:#64748b;stroke-width:3;fill:none;stroke-dasharray:8 5}
    </style>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="45" y="48" class="h">ASAR WIRING + POWER ARCHITECTURE</text>
  <text x="45" y="73" class="sub">Validate actual battery, regulator and driver ratings against the assembled hardware before energizing the robot.</text>

  <rect x="45" y="115" width="230" height="105" rx="14" class="box power"/>
  <text x="160" y="150" text-anchor="middle" class="t">3S battery + BMS</text>
  <text x="160" y="174" text-anchor="middle" class="s">nominal 11.1 V</text>
  <text x="160" y="194" text-anchor="middle" class="s">peak 12.6 V (source claim)</text>

  <rect x="350" y="115" width="190" height="105" rx="14" class="box power"/>
  <text x="445" y="150" text-anchor="middle" class="t">Fuse + master switch</text>
  <text x="445" y="174" text-anchor="middle" class="s">over-current cutoff</text>
  <text x="445" y="194" text-anchor="middle" class="xs">size from measured stall current</text>

  <rect x="620" y="95" width="255" height="145" rx="14" class="box power"/>
  <text x="747" y="132" text-anchor="middle" class="t">Motor power rail</text>
  <text x="747" y="158" text-anchor="middle" class="s">raw battery → L298N VMOT</text>
  <text x="747" y="182" text-anchor="middle" class="s">bulk capacitor near drivers</text>
  <text x="747" y="206" text-anchor="middle" class="xs">TVS / EMI protection recommended</text>

  <rect x="960" y="80" width="365" height="180" rx="14" class="box power"/>
  <text x="1142" y="118" text-anchor="middle" class="t">2 × L298N + four motors</text>
  <text x="1142" y="145" text-anchor="middle" class="s">left bank: ENA 5, ENB 6</text>
  <text x="1142" y="168" text-anchor="middle" class="s">right bank: ENA 8, ENB 9</text>
  <text x="1142" y="191" text-anchor="middle" class="s">direction pins: Mega 32–39</text>
  <text x="1142" y="218" text-anchor="middle" class="xs">never power motors from MCU pins</text>

  <rect x="350" y="330" width="250" height="125" rx="14" class="box logic"/>
  <text x="475" y="368" text-anchor="middle" class="t">Logic buck rail</text>
  <text x="475" y="394" text-anchor="middle" class="s">target 5 V logic (verify)</text>
  <text x="475" y="418" text-anchor="middle" class="s">separate filtering from motor rail</text>
  <text x="475" y="440" text-anchor="middle" class="xs">LM2596 is a presentation claim</text>

  <rect x="670" y="315" width="260" height="150" rx="14" class="box signal"/>
  <text x="800" y="352" text-anchor="middle" class="t">Arduino Mega 2560</text>
  <text x="800" y="379" text-anchor="middle" class="s">UART2: TX16 / RX17</text>
  <text x="800" y="403" text-anchor="middle" class="s">encoders: L18/19, R2/3</text>
  <text x="800" y="427" text-anchor="middle" class="s">I2C: SDA20 / SCL21</text>
  <text x="800" y="449" text-anchor="middle" class="xs">buzzer30, LED31</text>

  <rect x="1010" y="340" width="245" height="110" rx="14" class="box signal"/>
  <text x="1132" y="377" text-anchor="middle" class="t">ESP32 gateway</text>
  <text x="1132" y="403" text-anchor="middle" class="s">GPIO16 RX2 / GPIO17 TX2</text>
  <text x="1132" y="427" text-anchor="middle" class="s">WebSocket port 81</text>

  <rect x="85" y="570" width="230" height="90" rx="14" class="box logic"/>
  <text x="200" y="607" text-anchor="middle" class="t">Sensor harness</text>
  <text x="200" y="632" text-anchor="middle" class="s">4 × HC-SR04</text>
  <text x="200" y="650" text-anchor="middle" class="xs">L/F/R/B: 28/29, 22/23, 24/25, 26/27</text>

  <rect x="400" y="565" width="230" height="100" rx="14" class="box logic"/>
  <text x="515" y="602" text-anchor="middle" class="t">MPU-6050</text>
  <text x="515" y="627" text-anchor="middle" class="s">I2C 0x68</text>
  <text x="515" y="649" text-anchor="middle" class="xs">mount close to chassis center</text>

  <rect x="730" y="570" width="235" height="95" rx="14" class="box signal"/>
  <text x="847" y="607" text-anchor="middle" class="t">Encoder feedback</text>
  <text x="847" y="632" text-anchor="middle" class="s">quadrature A/B interrupts</text>
  <text x="847" y="652" text-anchor="middle" class="xs">verify wheel polarity and PPR</text>

  <rect x="1080" y="565" width="245" height="105" rx="14" class="box future"/>
  <text x="1202" y="602" text-anchor="middle" class="t">Target autonomy tier</text>
  <text x="1202" y="627" text-anchor="middle" class="s">Raspberry Pi + LiDAR + camera</text>
  <text x="1202" y="650" text-anchor="middle" class="xs">dedicated 5 V rail; ROS 2 target</text>

  <path d="M275 168 H350" class="p"/><path d="M540 168 H620" class="p"/><path d="M875 168 H960" class="p"/>
  <path d="M445 220 V330" class="l"/><path d="M540 390 H670" class="l"/><path d="M800 315 V240" class="b"/>
  <path d="M930 390 H1010" class="b"/>
  <path d="M475 455 C475 520 260 520 200 570" class="l"/>
  <path d="M520 455 V565" class="l"/><path d="M800 465 V570" class="b"/>
  <path d="M300 615 H400" class="ground"/><path d="M630 615 H730" class="ground"/><path d="M965 615 H1080" class="ground"/>

  <circle cx="1142" cy="745" r="18" fill="#64748b"/><text x="1170" y="751" class="s">single-point star ground / common GND</text>
  <path d="M200 660 C420 740 920 760 1142 745" class="ground"/>
  <rect x="45" y="755" width="16" height="10" fill="#dc2626"/><text x="70" y="765" class="xs">power</text>
  <rect x="145" y="755" width="16" height="10" fill="#15803d"/><text x="170" y="765" class="xs">regulated logic</text>
  <rect x="285" y="755" width="16" height="10" fill="#1d4ed8"/><text x="310" y="765" class="xs">signal</text>
  <rect x="385" y="755" width="16" height="10" fill="#7e22ce"/><text x="410" y="765" class="xs">future / verify</text>
</svg>
